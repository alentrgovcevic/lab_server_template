  });
}

/* ── the annotation lists: common (everyone edits) + mine ───────────── */
const ANN_PAGE = 100;
async function showAnnotations() {
  current = null; history.replaceState(null, "", "#annotations");
  document.querySelectorAll(".item.sel").forEach(el => el.classList.remove("sel"));
  const r = await api("/api/annotations");
  const typeSel = (v, attr) => `<select ${attr}>${r.types.map(t => `<option${t === v ? " selected" : ""}>${esc(t)}</option>`).join("")}</select>`;
  const rows = list => list.map(e => `<tr><td><input type="text" data-al="${e.id}" value="${esc(e.label)}" style="width:180px"></td>
      <td>${typeSel(e.type, `data-at="${e.id}"`)}</td><td class="num">${e.length.toLocaleString()}</td>
      <td class="ctx" style="max-width:260px;overflow:hidden;text-overflow:ellipsis" title="${esc(e.seq)}">${esc(e.seq.slice(0, 40))}${e.seq.length > 40 ? "…" : ""}</td>
      <td class="note">${esc(e.added_by)}${e.maps ? ` · in ${e.maps} maps` : ""}</td><td><button data-adel="${e.id}">delete</button></td></tr>`).join("");
  const head = `<thead><tr><th>Label</th><th>Type</th><th class="num">bp</th><th>Sequence</th><th>Added by</th><th></th></tr></thead>`;
  // three groups: the pLannotate import, the lab's own parts from PM/EC maps, and mine
  const isPl = e => /^plannotate/i.test(e.note || "");
  const groups = [
    {key: "pl", title: "pLannotate", note: "imported from pLannotate's feature set (shared)", list: r.entries.filter(e => e.scope === "common" && isPl(e))},
    {key: "lab", title: "From PM and EC plasmids", note: "the lab's own parts, shared; anyone can edit", list: r.entries.filter(e => e.scope === "common" && !isPl(e))},
    {key: "mine", title: "My list", note: "only yours", list: r.entries.filter(e => e.scope === "mine")},
  ];
  const card = g => `<a href="#" class="card" data-ago="${g.key}" style="display:block;padding:10px 14px;min-width:180px;text-decoration:none;color:inherit">
      <div style="font-size:22px;font-weight:700">${g.list.length.toLocaleString()}</div><div><b>${esc(g.title)}</b></div><div class="note">${esc(g.note)}</div></a>`;
  $("#detail").innerHTML = `<h2 style="font-family:inherit">Annotation lists</h2>
    <p class="note">Auto-annotate (Features tab) looks for every part below in a map: exact matches, both strands, across the origin.
      The <b>common list</b> is shared and anyone can edit it; <b>my list</b> is only yours.</p>
    <label><input type="checkbox" id="aonup"${r.annotate_on_upload ? " checked" : ""}> annotate my new maps automatically when I upload them (GenBank uploads)</label>
    <h3 style="margin-top:16px">Add a part</h3>
    <div class="controls"><input type="text" id="nlab" placeholder="label, e.g. 35S promoter" style="width:200px">${typeSel("misc_feature", 'id="ntype"')}
      <select id="nscope"><option value="common">to the common list</option><option value="mine">to my list</option></select>
      <button class="primary" id="nadd">Add</button><span id="nmsg"></span></div>
    <textarea id="nseq" rows="2" style="width:100%;font-family:var(--mono);font-size:12px" placeholder="sequence, 5′→3′ on the part's own strand (15–10,000 bases)"></textarea>
    <p class="note">Or select a stretch on any map and use "save selection as annotation" under the map.</p>
    <h3 style="margin-top:16px">The lists</h3>
    <div style="display:flex;gap:10px;flex-wrap:wrap">${groups.map(card).join("")}</div>
    <div class="controls" style="margin-top:10px"><input type="search" id="asearch" placeholder="search a label, type, note or sequence…" style="width:320px"></div>
    ${groups.map(g => `<h3 style="margin-top:16px" id="ag-${g.key}">${esc(g.title)} <span class="note" data-acount="${g.key}">${g.list.length.toLocaleString()}</span></h3><div data-alist="${g.key}"></div>`).join("")}
    <h3 style="margin-top:16px">Suggestions from the bank</h3>
    <div class="controls"><label>found in at least <input type="number" id="smin" value="5" min="2" style="width:60px"> maps</label>
      <button id="sgo">Find the most used parts</button><span class="note">features whose exact sequence recurs across maps; reads the whole bank, so it takes a moment</span></div>
    <div id="sres"></div>`;
  const save = async (id, body) => { try { await api(`/api/annotations/${id}`, {method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)}); } catch (e) { alert(e.message); } };
  // each list shows ANN_PAGE rows, then "show more"; the search box filters all three
  const shown = {}, matches = (e, q) => !q || [e.label, e.type, e.note, e.added_by].some(x => (x || "").toLowerCase().includes(q))
    || (q.length >= 6 && /^[acgtn]+$/.test(q) && e.seq.toLowerCase().includes(q));
  const drawList = g => {
    const q = $("#asearch").value.trim().toLowerCase(), hits = g.list.filter(e => matches(e, q)), n = shown[g.key] || ANN_PAGE;
    const box = $("#detail").querySelector(`[data-alist="${g.key}"]`);
    $("#detail").querySelector(`[data-acount="${g.key}"]`).textContent = q ? `${hits.length.toLocaleString()} of ${g.list.length.toLocaleString()} match` : g.list.length.toLocaleString();
    box.innerHTML = !g.list.length ? `<p class="note">Empty.${g.key === "lab" ? " Start from the suggestions below." : ""}</p>`
      : !hits.length ? `<p class="note">No match.</p>`
      : `<table>${head}<tbody>${rows(hits.slice(0, n))}</tbody></table>${hits.length > n ? `<div class="controls"><span class="note">showing ${n.toLocaleString()} of ${hits.length.toLocaleString()}</span>
          <button data-amore="${g.key}">show ${Math.min(ANN_PAGE, hits.length - n)} more</button><button data-aall="${g.key}">show all</button></div>` : ""}`;
    box.querySelectorAll("[data-al]").forEach(el => el.onchange = () => save(el.dataset.al, {label: el.value}));
    box.querySelectorAll("[data-at]").forEach(el => el.onchange = () => save(el.dataset.at, {type: el.value}));
    box.querySelectorAll("[data-adel]").forEach(b => b.onclick = async () => {
      if (!confirm("Delete this part from the list?")) return;
      await api(`/api/annotations/${b.dataset.adel}`, {method: "DELETE"}); showAnnotations();
    });
    box.querySelectorAll("[data-amore]").forEach(b => b.onclick = () => { shown[g.key] = n + ANN_PAGE; drawList(g); });
    box.querySelectorAll("[data-aall]").forEach(b => b.onclick = () => { shown[g.key] = hits.length; drawList(g); });
  };
  const drawAll = () => groups.forEach(drawList);
  drawAll();
  let aTimer;
  $("#asearch").oninput = () => { clearTimeout(aTimer); aTimer = setTimeout(() => { for (const k in shown) delete shown[k]; drawAll(); }, 150); };
  $("#detail").querySelectorAll("[data-ago]").forEach(a => a.onclick = ev => { ev.preventDefault(); $(`#ag-${a.dataset.ago}`).scrollIntoView({behavior: "smooth"}); });
  $("#aonup").onchange = e => api("/api/annotations/settings", {method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify({annotate_on_upload: e.target.checked})});
  $("#nadd").onclick = async () => {
    try { await api("/api/annotations", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({label: $("#nlab").value, type: $("#ntype").value, scope: $("#nscope").value, seq: $("#nseq").value})}); showAnnotations(); }
    catch (e) { $("#nmsg").innerHTML = `<span class="v-bad">${esc(e.message)}</span>`; }
  };
  $("#sgo").onclick = async () => {
    $("#sres").innerHTML = `<p class="note">Reading the bank…</p>`;
    let S;
    try { S = await api(`/api/annotations/suggest?min_maps=${+$("#smin").value || 5}`); }
    catch (e) { $("#sres").innerHTML = `<p class="v-bad">${esc(e.message)}</p>`; return; }
    $("#sres").innerHTML = S.length ? `<table><thead><tr><th>Label</th><th>Type</th><th class="num">bp</th><th class="num">Maps</th><th>Also called</th><th></th></tr></thead><tbody>${
      S.map((c, i) => `<tr><td>${esc(c.label)}</td><td>${esc(c.type)}</td><td class="num">${c.length.toLocaleString()}</td><td class="num">${c.maps}</td>
        <td class="note">${esc(c.also_called.join(", "))}</td><td><button data-sadd="${i}">＋ common</button></td></tr>`).join("")}</tbody></table>`
      : `<p class="note">Nothing new recurs that often.</p>`;
    $("#sres").querySelectorAll("[data-sadd]").forEach(b => b.onclick = async () => {
      const c = S[+b.dataset.sadd];
      try { await api("/api/annotations", {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({label: c.label, type: c.type, seq: c.seq, scope: "common", maps: c.maps})});
        b.replaceWith(Object.assign(document.createElement("span"), {className: "v-good", textContent: "added"})); }
      catch (e) { alert(e.message); }
    });
  };
}

/* What each export keeps, shown on its button: people lose history by picking the wrong format */
const KEEPS = {
  gb_product: "GenBank keeps the sequence, features and topology. The recipe (parts in order, orientation, junctions, date) is written into its COMMENT line; GenBank has no field for history beyond that.",
  gb_edit: "GenBank keeps the sequence, features and topology. The original file is never changed.",
};
function download(name, text) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type: "text/plain"}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}

/* ── map picker shared by Assemble / Gel / Align ────────────────────── */
/* The files only you (and project members) see, shaped like /api/maps rows; fetched once per page. */
let myFilesP = null;
function myFiles() {
  return myFilesP ||= (async () => {
    try {
      const out = [];
      for (const p of await api("/api/projects")) {
        if (!p.n_items) continue;
        for (const it of (await api(`/api/projects/${p.id}`)).items)
          if (it.kind === "draft" && it.key != null && !it.error)
            out.push({key: it.key, plasmid_id: it.label || it.name || "draft", file: [it.folder, it.label || it.name].filter(Boolean).join("/"), length: 0, where: p.personal ? "My workspace" : p.name});
      }
      return out;
    } catch (e) { return []; }  // single-user mode: no projects
  })();
}

function mapPicker(id, chosen, onChange) {
  const box = $("#" + id);
  box.innerHTML = `<input type="search" placeholder="search maps to add…" style="width:260px"> <span class="note">selected:</span> <span class="chosen"></span><div class="hits" style="max-height:160px;overflow:auto;margin-top:4px"></div>`;
  const inp = box.querySelector("input"), hits = box.querySelector(".hits"), shown = box.querySelector(".chosen");
  const render = () => { shown.innerHTML = chosen.map((m, i) => `<span class="badge b-info" style="cursor:pointer" data-x="${i}" title="remove">${esc(m.plasmid_id || m.file)} ✕</span>`).join(" ") || "none";
    shown.querySelectorAll("[data-x]").forEach(b => b.onclick = () => { chosen.splice(+b.dataset.x, 1); render(); onChange(); }); };
  let t; inp.oninput = () => { clearTimeout(t); t = setTimeout(async () => {
    if (!inp.value.trim()) { hits.innerHTML = ""; return; }
    // your own files first (My workspace, project drafts): an L0 module you made can go into Golden Gate
    const ql = inp.value.trim().toLowerCase(), own = (await myFiles()).filter(m => `${m.plasmid_id} ${m.file}`.toLowerCase().includes(ql));
    const all = [...own, ...(await api("/api/maps?q=" + encodeURIComponent(inp.value))).filter(m => m.length)], rows = all.slice(0, 30);
    hits.innerHTML = (all.length > rows.length ? `<p class="note" style="margin:2px 8px">first ${rows.length} of ${all.length}: type more to narrow</p>` : "") + rows.map(m => `<div class="item" data-k="${m.key}" style="padding:3px 8px"><span class="id">${esc(m.plasmid_id || "—")}</span> ${m.key < 0 ? `<span class="badge b-info">${esc(m.where)}</span> ` : ""}<span class="note">${esc(m.file.split("/").pop())}${m.length ? ` · ${m.length.toLocaleString()} bp` : ""}</span></div>`).join("");
    hits.querySelectorAll("[data-k]").forEach(d => d.onclick = () => { const m = rows.find(r => r.key === +d.dataset.k); if (!chosen.some(c => c.key === m.key)) chosen.push(m); render(); onChange(); });
  }, 200); };
  render();
}

async function paneBuild(mode) {
  const m = current, gib = mode === "gibson";
  const sites = await api(`/api/maps/${m.key}/sites?set=unique`).catch(() => []);  // a plain list
  const uniq = sites.filter(e => e.n === 1).map(e => e.enzyme);
  $("#apane").innerHTML = `
    <p class="note"><b>${esc(m.plasmid_id || "This map")}</b> is the vector. ${gib
      ? `Each PCR piece gets primers whose 5′ tails make the overlaps; a pasted fragment is extended instead (order it as written).`
      : `No primers: this only draws the map of a cloning you have already done.`}</p>
    <div class="controls">
      <b>Open the vector</b>
      <label><input type="radio" name="vopen" value="enz" checked> cut with</label>
      <select id="venz1">${uniq.map(e => `<option>${esc(e)}</option>`).join("") || `<option value="">(no unique cutter)</option>`}</select>
      <select id="venz2"><option value="">— one enzyme only —</option>${uniq.map(e => `<option>${esc(e)}</option>`).join("")}</select>
      <span class="note">unique cutters only; with two, the longer piece is kept</span>
    </div>
    <div class="controls">
      <label><input type="radio" name="vopen" value="pcr"> by PCR: remove</label>
      <label>start <input type="number" id="vstart" min="1" max="${m.length}" style="width:80px"></label>
      <label>end <input type="number" id="vend" min="0" max="${m.length}" style="width:80px"></label>
      <button id="vsel" title="take the region from the map selection">use map selection</button>
      <span class="note">end = start − 1 inserts without removing anything</span>
    </div>
    <h3 style="font-size:14px;margin:14px 0 4px">Inserts <span class="note">up to 5</span></h3>
    <div id="brows"></div>
    <div class="controls"><button id="baddmap">＋ region of a map</button><button id="baddseq">＋ pasted sequence</button></div>
    <div class="controls">
      ${gib ? `<label>overlap <input type="number" id="bov" value="25" min="15" max="40" style="width:60px"> nt</label>
      <label>Tm °C <input type="number" id="btm" value="60" step="0.5" style="width:64px"></label>
      <label title="annealing part; the overlap tail comes on top">primer length <input type="number" id="bmin" min="12" max="40" placeholder="18" style="width:52px">–<input type="number" id="bmax" min="12" max="40" placeholder="35" style="width:52px"> nt</label>` : ""}
      <label>name <input type="text" id="bname" placeholder="new construct" style="width:200px"></label>
      <button class="primary" id="bgo">${gib ? "Design" : "Build the map"}</button>
    </div>
    <div id="bres"></div><div id="pad"></div>`;
  buildRows = [];
  const draw = () => {
    $("#brows").innerHTML = buildRows.map((r, i) => r.kind === "seq"
      ? `<div class="card" style="padding:8px 10px"><div class="controls"><b>${i + 1}. pasted</b>
           <label>name <input type="text" data-bn="${i}" value="${esc(r.name)}" style="width:160px"></label>
           <button data-brm="${i}">remove</button></div>
         <textarea data-bs="${i}" rows="3" style="width:100%;font-family:var(--mono);font-size:12px" placeholder="sequence to order (gBlock, annealed oligos…)">${esc(r.seq)}</textarea></div>`
      : `<div class="card" style="padding:8px 10px"><div class="controls"><b>${i + 1}. map</b>
           <span class="id" data-bmap="${i}">${r.map ? esc(r.map.plasmid_id || r.map.file) : "none chosen"}</span>
           <input type="search" data-bq="${i}" placeholder="search maps…" style="width:170px">
           <label>start <input type="number" data-bst="${i}" value="${r.start || ""}" style="width:80px"></label>
           <label>end <input type="number" data-ben="${i}" value="${r.end || ""}" style="width:80px"></label>
           <label>strand <select data-bstr="${i}"><option value="+">+</option><option value="-"${r.strand === "-" ? " selected" : ""}>−</option></select></label>
           <label>name <input type="text" data-bn="${i}" value="${esc(r.name)}" style="width:140px"></label>
           <button data-brm="${i}">remove</button></div><div class="hits" data-bh="${i}"></div></div>`).join("")
      || `<p class="note">No inserts yet.</p>`;
    $("#brows").querySelectorAll("[data-brm]").forEach(b => b.onclick = () => { buildRows.splice(+b.dataset.brm, 1); draw(); });
    $("#brows").querySelectorAll("[data-bn]").forEach(el => el.oninput = () => buildRows[+el.dataset.bn].name = el.value);
    $("#brows").querySelectorAll("[data-bs]").forEach(el => el.oninput = () => buildRows[+el.dataset.bs].seq = el.value);
    $("#brows").querySelectorAll("[data-bst]").forEach(el => el.oninput = () => buildRows[+el.dataset.bst].start = el.value);
    $("#brows").querySelectorAll("[data-ben]").forEach(el => el.oninput = () => buildRows[+el.dataset.ben].end = el.value);
    $("#brows").querySelectorAll("[data-bstr]").forEach(el => el.onchange = () => buildRows[+el.dataset.bstr].strand = el.value);
    $("#brows").querySelectorAll("[data-bq]").forEach(el => {
      let t;
      el.oninput = () => { clearTimeout(t); t = setTimeout(async () => {
        const i = +el.dataset.bq, hits = $(`[data-bh="${i}"]`);
        if (!el.value.trim()) { hits.innerHTML = ""; return; }
        const rows = (await api("/api/maps?q=" + encodeURIComponent(el.value))).filter(x => x.length).slice(0, 15);
        hits.innerHTML = rows.map(x => `<div class="item" data-k="${x.key}" style="padding:3px 8px"><span class="id">${esc(x.plasmid_id || "—")}</span> <span class="note">${esc(x.file.split("/").pop())} · ${x.length.toLocaleString()} bp</span></div>`).join("");
        hits.querySelectorAll("[data-k]").forEach(d => d.onclick = () => {

      }, 200); };
    });
  };
  const add = kind => { if (buildRows.length >= 5) return; buildRows.push({kind, name: "", seq: "", strand: "+"}); draw(); };
  $("#baddmap").onclick = () => add("map");
  $("#baddseq").onclick = () => add("seq");
  $("#vsel").onclick = () => {
    const r = selRegion || (zoom ? {start: (Math.floor(zoom.start) % m.length) + 1, end: ((Math.ceil(zoom.start + zoom.width) - 1) % m.length) + 1} : null);
    if (!r) { $("#bres").innerHTML = `<p class="note">Nothing selected: zoom into the map and drag along its ruler, or click a feature.</p>`; return; }
    $("#vstart").value = r.start; $("#vend").value = r.end;
    document.querySelector("[name=vopen][value=pcr]").checked = true;
  };
  $("#bgo").onclick = async () => {
    const pcr = document.querySelector("[name=vopen]:checked").value === "pcr";
    const body = {vector: m.key, mode, name: $("#bname").value,
      open: pcr ? {start: +$("#vstart").value, end: +$("#vend").value}
                : {enzymes: [$("#venz1").value, $("#venz2").value].filter(Boolean)},
      inserts: buildRows.map(r => r.kind === "seq" ? {seq: r.seq, name: r.name}
        : {key: r.map && r.map.key, start: +r.start, end: +r.end, strand: r.strand, name: r.name})};
    if (gib) {
      body.overlap = +$("#bov").value; body.opt_tm = +$("#btm").value;
      if ($("#bmin").value) body.min_len = +$("#bmin").value;
      if ($("#bmax").value) body.max_len = +$("#bmax").value;
    }
    $("#bres").innerHTML = `<p class="note">Working…</p>`;
    padCands = [];
    try { showBuild(await api("/api/build", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)})); }
    catch (e) { $("#bres").innerHTML = `<p class="v-bad">${esc(e.message)}</p>`; }
  };
  draw();
  padRender(); padCheck(false);
}

    <table><thead><tr><th></th><th>5′→3′</th><th class="num">nt</th><th class="num">Tm °C</th><th class="num">GC %</th><th class="num">binds</th><th>checks</th><th></th></tr></thead><tbody>${
    r.primers.map(p => primerRow(p, `${p.piece} ${p.dir}`, asciiName(`${r.name}_${p.piece}_${p.dir}`), `Gibson ${r.name}`)).join("")}</tbody></table>` : "";
  const order = r.order_fragments.length ? `<h3 style="font-size:14px;margin:12px 0 4px">Fragments to order</h3>${
    r.order_fragments.map(o => `<div class="card" style="padding:8px 10px"><b>${esc(o.name)}</b> <span class="note">${o.sequence.length} nt${o.added_left || o.added_right ? ` · ${o.added_left} + ${o.added_right} nt of overlap added` : ""}</span>
      <div class="seq" style="max-height:120px">${esc(o.sequence)}</div></div>`).join("")}` : "";
  $("#bres").innerHTML = `${r.warnings.map(w => `<p class="msgs">⚠ ${esc(w)}</p>`).join("")}
    <div class="card"><h3>${esc(r.name)} <span class="note">${r.length.toLocaleString()} bp · circular · vector opened by ${esc(r.vector.opened_by)}, ${r.vector.dropped_bp.toLocaleString()} bp removed</span></h3>
      ${pieces}${junc}${prim}${order}
      <div class="controls" style="margin-top:10px"><button class="primary" id="bdl" title="${esc(KEEPS.gb_product)}">download .gb</button>
        <span id="bsave"></span></div>
      <p class="note">${gib ? "Check the assembly in the lab: this is a simulation. " : ""}Specificity checked against ${esc(r.checked_against)}. Tm: ${esc(r.tm_model)}.</p>
    </div>`;
  $("#bdl").onclick = () => download(`${asciiName(r.name)}.gb`, r.genbank);
  buildSaveBox($("#bsave"), r.genbank, r.name);
  $("#bres").addEventListener("click", e => { const b = e.target.closest("[data-pad]"); if (b) padAdd(padCands[+b.dataset.pad]); });
}

/* Save generated GenBank text as a draft. Into My workspace it asks for a name and a folder first. Null when the dialog is cancelled. */
async function saveTextDraft(project, filename, text, label) {
  let folder = "";
  if (project.personal) {
    const a = await askNameFolder("Save to My workspace", label, "");
    if (!a) return null;
    ({label, folder} = a);
  }
  const d = await api(`/api/projects/${project.id}/drafts/text`, {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({filename, text, label, folder})});
  if (project.personal) loadProjectFolders();
  return {folder, link: project.personal ? `<a href="/bank#-${d.id}/features" onclick="openMap(${-d.id}); return false">open it</a>` : `<a href="/#project/${project.id}/${d.id}">open project</a>`};
}

/* "save this generated map": into a project as a draft, or into the bank with its lab ID */
async function buildSaveBox(el, genbank, name) {
  let projects = [];
  try { projects = await api("/api/projects"); } catch (e) { /* none */ }
  el.innerHTML = `${projects.length ? `<span class="note">save as a draft in</span> <select id="bproj">${projects.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select> <button id="bprojgo">save</button> · ` : ""}
    <span class="note">or put it in the bank:</span> <input type="text" id="bpid" placeholder="PMC-07383" style="width:120px"> <button id="bupgo">upload</button> <span id="bmsg" class="note"></span>`;
  $("#bprojgo") && ($("#bprojgo").onclick = async () => {
    try { const s = await saveTextDraft(projects.find(p => p.id === +$("#bproj").value), `${asciiName(name)}.gb`, genbank, name);
      if (s) $("#bmsg").innerHTML = `<span class="v-good">saved${s.folder ? ` in ${esc(s.folder)}` : ""}</span> · ${s.link}`;
    } catch (e) { $("#bmsg").innerHTML = `<span class="v-bad">${esc(e.message)}</span>`; }
  });
  $("#bupgo").onclick = async () => {
    const fd = new FormData();
    fd.append("file", new Blob([genbank], {type: "text/plain"}), `${asciiName(name)}.gb`);
    fd.append("plasmid_id", $("#bpid").value); fd.append("construct_name", name);
    try { const r = await api("/api/upload", {method: "POST", body: fd});
      $("#bmsg").innerHTML = r.draft ? `<span class="v-good">saved in <a href="/bank#${r.key}/features">My workspace</a> (no lab ID: not in the bank; copied to the share under Workspaces/)</span>`
        : `<span class="v-good">in the bank as ${esc(r.file)}</span>`;
      loadList($("#q").value);
    } catch (e) { $("#bmsg").innerHTML = `<span class="v-bad">${esc(e.message)}</span>`; }
  };
}

/* Golden Gate results, shared by the Assemble tab and the toolbox page (#gg) */
async function renderGG(r, el, projectId) {
  const inputs = `<table><thead><tr><th>Input</th><th class="num">cuts</th><th>fragments (length · left…right overhang · kept?)</th></tr></thead><tbody>${
    r.inputs.map(i => `<tr><td>${esc(i.source)}</td><td class="num">${i.cuts}</td><td class="ctx" style="white-space:normal">${i.fragments.map(f => `${f.length} bp · ${esc(f.left)}…${esc(f.right)}${f.kept ? " ✓" : " ✗"}`).join("<br>")}</td></tr>`).join("")}</tbody></table>`;
  const errs = r.errors.map(e => `<p class="v-bad">${esc(e)}</p>`).join("");
  const diag = (r.diagnosis || []).length ? `<div class="card"><h3>Why it does not close</h3>
    <p class="note">One circle needs every overhang to be used by exactly two ends (orientation does not matter: the reverse complement counts).</p>
    <table><thead><tr><th>Overhang</th><th>Problem</th><th>Used by</th><th>Hint</th></tr></thead><tbody>${r.diagnosis.map(d => `<tr>
      <td class="ctx">${esc(d.overhang)}${d.site ? `<br><span class="note">${esc(d.site)}</span>` : ""}</td><td>${esc(d.problem)}</td>
      <td>${d.ends.map(esc).join("<br>")}</td>
      <td>${d.one_base_from.length ? `one base from <b class="ctx">${d.one_base_from.map(esc).join(", ")}</b>: a typo in a primer tail?` : d.problem === "no partner" ? "a part is missing, or this part is from another level/standard" : "two parts compete for this junction"}</td></tr>`).join("")}</tbody></table></div>` : "";
  let projects = [];
  try { projects = await api("/api/projects"); } catch (e) { /* projects not available */ }
  const projSel = projects.length ? `<select data-proj>${projects.map(p => `<option value="${p.id}"${p.id === projectId ? " selected" : ""}>${esc(p.name)}</option>`).join("")}</select>` : "";
  const prods = r.products.map((p, i) => {
    const fake = {seq: p.seq, length: p.length, plasmid_id: "product " + (i + 1), topology: "circular",
      features: p.features.map(f => ({...f, wraps: f.end < f.start}))};
    return `<div class="card"><h3>Product ${i + 1} <span class="note">${p.length.toLocaleString()} bp</span>
      <button class="primary" style="float:right;padding:3px 10px" data-dl="${i}" title="${esc(KEEPS.gb_product)}">download .gb</button></h3>
      ${p.warnings.map(w => `<p class="msgs">⚠ ${esc(w)}</p>`).join("")}
      ${ggDiagram(p)}
      <details data-junc-box="${i}"><summary>Check overhangs <span class="note">· every junction base by base (or click an overhang above)</span></summary>${ggJunctions(p)}</details>
      <div class="controls" style="margin-top:6px"><button data-bigmap="${i}" title="show the product map larger">⤢ larger map</button></div>
      <div data-mapbox="${i}" style="max-width:360px">${mapSvg(fake).replace('id="mapsvg"', 'class="prodsvg"')}</div>
      ${projSel ? `<div class="controls" style="margin-top:6px"><span class="note">Save as a draft in project</span> ${projSel.replace("data-proj", `data-proj="${i}"`)}
        <button data-save="${i}">save</button><span class="note" data-saved="${i}"></span></div>` : ""}</div>`;
  }).join("");
  el.innerHTML = errs + diag + prods + `<details><summary class="note">digest details</summary>${inputs}</details>`;
  el.querySelectorAll("[data-junc]").forEach(t => t.onclick = () => {
    const box = t.closest(".card").querySelector("[data-junc-box]"), row = box.querySelector(`[data-jrow="${t.dataset.junc}"]`);
    box.open = true;
    box.querySelectorAll("[data-jrow]").forEach(x => x.classList.toggle("jsel", x === row));
    row.scrollIntoView({block: "nearest", behavior: "smooth"});
  });
  el.querySelectorAll("[data-bigmap]").forEach(b => b.onclick = () => {
    const box = el.querySelector(`[data-mapbox="${b.dataset.bigmap}"]`), big = box.style.maxWidth !== "360px";
    box.style.maxWidth = big ? "360px" : "760px";
    b.textContent = big ? "⤢ larger map" : "⤡ smaller map";
  });
  el.querySelectorAll("[data-dl]").forEach(b => b.onclick = () => download(`GG_product_${+b.dataset.dl + 1}.gb`, r.products[+b.dataset.dl].genbank));
  el.querySelectorAll("[data-save]").forEach(b => b.onclick = async () => {
    const i = +b.dataset.save, pid = +el.querySelector(`[data-proj="${i}"]`).value, out = el.querySelector(`[data-saved="${i}"]`);
    const label = "GG " + r.products[i].parts.map(x => x.source).join(" + ");
    try { const s = await saveTextDraft(projects.find(p => p.id === pid), `GG_product_${i + 1}.gb`, r.products[i].genbank, label);
      if (s) out.innerHTML = `<span class="v-good">saved${s.folder ? ` in ${esc(s.folder)}` : ""}</span> · ${s.link}`; }
    catch (e) { out.innerHTML = `<span class="v-bad">${esc(e.message)}</span>`; }
  });
}

/* Parts in assembly order as arrows (pointing left = used reverse-complemented), overhangs between them */
const GG_COLS = ["--f-cds", "--f-promoter", "--f-terminator", "--f-ori", "--f-primer", "--f-other", "--f-misc"];
function ggDiagram(p) {
  const n = p.parts.length, W = 150, H = 92, x0 = 20, w = n * W + 130, cols = GG_COLS;
  let s = `<svg viewBox="0 0 ${w} ${H}" style="width:100%;max-width:${w}px;display:block;margin:6px 0" role="img" aria-label="assembly order">`;
  p.parts.forEach((x, i) => {
    const a = x0 + i * W + 8, b = a + W - 16, y = 18, h = 26, rev = x.orientation === "-", tip = 10;
    const pts = rev ? `${a},${y + h / 2} ${a + tip},${y} ${b},${y} ${b},${y + h} ${a + tip},${y + h}` : `${a},${y} ${b - tip},${y} ${b},${y + h / 2} ${b - tip},${y + h} ${a},${y + h}`;
    s += `<polygon points="${pts}" fill="${css(cols[i % cols.length])}" opacity=".85"><title>${esc(x.source)} ${rev ? "(reverse complement)" : ""} ${x.length} bp</title></polygon>`;
    s += `<text x="${(a + b) / 2}" y="${y + 17}" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">${esc(String(x.source).slice(0, 16))}</text>`;
    if (rev) s += `<text x="${(a + b) / 2}" y="${y + h + 12}" text-anchor="middle" font-size="10" fill="${css("--warn")}">reversed</text>`;
  });
  p.junctions.forEach((j, i) => {
    const last = i === p.junctions.length - 1, x = last ? x0 + n * W + 30 : x0 + (i + 1) * W;
    s += `<g data-junc="${i}" style="cursor:pointer"><title>${esc(j.between)}: click to zoom in on this junction</title>`
      + `<rect x="${x - 70}" y="${H - 36}" width="140" height="34" fill="transparent"/>`
      + `<text x="${x}" y="${H - 22}" text-anchor="middle" font-size="11" font-family="${css("--mono")}" fill="${css("--accent")}" text-decoration="underline">${last ? "↺ " : ""}${esc(j.overhang)}</text>`;
    if (j.site) s += `<text x="${x}" y="${H - 8}" text-anchor="middle" font-size="9" fill="${css("--muted")}">${esc(j.site.split(" / ")[0])}</text>`;
    s += `</g>`;
  });
  return s + `</svg>`;
}

/* One junction per row, zoomed to the bases: both strands, the overhang shaded, the nicks drawn where
   each strand was cut, flanks coloured as the parts in the diagram. Checks: standard fusion site,
   palindrome, and the closest other overhang of this assembly (either strand), since overhangs one
   base apart can mis-ligate. */
const GG_FLANK = 20;
function ggJunctions(p) {
  if (!p.junctions.some(j => j.pos != null)) return `<p class="note">Positions not available for this product.</p>`;
  const L = p.seq.length, n = p.parts.length, comp = s => revComp(s).split("").reverse().join("");
  const at = (a, len) => { let s = ""; for (let k = 0; k < len; k++) s += p.seq[((a + k) % L + L) % L]; return s; };
  const ohs = p.junctions.map(j => j.overhang.toUpperCase());
  const diff = (a, b) => a.length !== b.length ? Infinity : [...a].filter((c, k) => c !== b[k]).length;
  const rows = p.junctions.map((j, i) => {
    const k = j.overhang.length, oh = ohs[i], pos = j.pos;
    const left = at(pos - GG_FLANK, GG_FLANK), mid = at(pos, k), right = at(pos + k, GG_FLANK);
    const cl = css(GG_COLS[i % GG_COLS.length]), cr = css(GG_COLS[(i + 1) % n % GG_COLS.length]);
    // 5' overhang: top strand nicked before it, bottom after; 3' the other way round
    const five = j.kind !== "3'", blunt = !k;
    const nick = side => `box-shadow:inset ${side === "l" ? "2px" : "-2px"} 0 0 var(--bad)`;
    const strand = (l, m, r, isTop) => `<span style="color:${cl}">${esc(l)}</span>`
      + `<span style="background:var(--accent-soft);font-weight:700;${blunt ? "" : nick((isTop === five) ? "l" : "r")}">${esc(m)}</span>`
      + `<span style="color:${cr}">${esc(r)}</span>`;
    let close = null;
    p.junctions.forEach((o, m) => {
      if (m === i) return;
      for (const [cand, how] of [[ohs[m], ""], [revComp(ohs[m]), " (other strand)"]]) {
        const d = diff(oh, cand);
        if (!close || d < close.d) close = {d, text: `${cand}${how}, junction ${m + 1}`};
      }
    });
    const checks = [
      j.site ? `<span class="v-good">✓ ${esc(j.site)}</span>` : `<span class="note">not a standard fusion site</span>`,
      oh && oh === revComp(oh) ? `<span class="v-bad">⚠ palindromic: can ligate to itself</span>` : "",
      close ? (close.d <= 1 ? `<span class="v-bad">⚠ ${close.d === 0 ? "same as" : "one base from"} ${esc(close.text)}: may mis-ligate</span>`
        : `<span class="note">closest other overhang ${esc(close.text)}, ${close.d} differences</span>`) : "",
      blunt ? "" : `<span class="note">${esc(j.kind)} overhang · ${[...oh].filter(c => "GC".includes(c)).length}/${k} GC</span>`,
    ].filter(Boolean).join(" · ");
    const [a, b] = j.between.split(" | ");
    return `<div data-jrow="${i}" class="jrow"><div><b>${i + 1}</b> · <span style="color:${cl}">${esc(a)}</span> → <span style="color:${cr}">${esc(b)}</span>
        <span class="note">· overhang at ${(pos + 1).toLocaleString()}–${(pos + k).toLocaleString()}</span></div>
      <div class="ctx" style="margin:4px 0;overflow-x:auto">5′ ${strand(left, mid, right, true)} 3′
3′ ${strand(comp(left), comp(mid), comp(right), false)} 5′</div>
      <div style="font-size:12px">${checks}</div></div>`;
  });
  return `<p class="note">${GG_FLANK} bp each side. Red ticks are where each strand was cut, so the shaded bases are the single-stranded overhang that pairs.</p>` + rows.join("");
}

  $("#pane").innerHTML = `<div class="controls"><label>Ladder <select id="gladder"><option>1 kb (NEB N3232)</option><option>GeneRuler 1 kb (Thermo SM0311)</option><option>100 bp (NEB N3231)</option></select></label>

async function runGel() {
  let r;
  try { r = await api("/api/gel", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({lanes: gelLanes.map(l => ({key: l.key, enzymes: l.enzymes.split(/[\s,+]+/).filter(Boolean)})), ladder: $("#gladder").value})}); }
  catch (e) { $("#gelout").innerHTML = `<p class="v-bad">${esc(e.message)}</p>`; return; }
  const lanes = [r.ladder, ...r.lanes], W = 90 + lanes.length * 70, H = 420, top = 30, bottom = 400;
  const lo = Math.log10(80), hi = Math.log10(Math.max(12000, ...lanes.flatMap(l => l.bands || []).map(b => b * 1.2)));
  const y = bp => top + (hi - Math.log10(bp)) / (hi - lo) * (bottom - top);
  let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;background:#111;border-radius:8px" role="img" aria-label="virtual gel">`;
  lanes.forEach((l, i) => {
    const x = 70 + i * 70;
    s += `<rect x="${x - 26}" y="${top - 12}" width="52" height="8" fill="#333"/>`;
    s += `<text x="${x}" y="${top - 16}" font-size="9" fill="#ccc" text-anchor="middle">${i === 0 ? "ladder" : "lane " + i}</text>`;
    (l.bands || []).forEach(b => {
      if (b < 80) return;
      s += `<rect x="${x - 24}" y="${y(b) - 2}" width="48" height="4" rx="1" fill="#f4f4f4" opacity="${i === 0 ? .8 : .95}"><title>${b.toLocaleString()} bp</title></rect>`;
      if (i === 0) s += `<text x="${x - 30}" y="${y(b) + 3}" font-size="9" fill="#bbb" text-anchor="end">${b >= 1000 ? b / 1000 + " kb" : b}</text>`;
    });
    if (l.uncut) s += `<text x="${x}" y="${(top + bottom) / 2}" font-size="9" fill="#999" text-anchor="middle">uncut</text>`;
  });
  s += `</svg>`;
  $("#gelout").innerHTML = s + `<table style="margin-top:8px"><thead><tr><th>Lane</th><th>Digest</th><th>Bands (bp)</th></tr></thead><tbody>${
    r.lanes.map((l, i) => `<tr><td>${i + 1}</td><td>${esc(l.label)}</td><td>${l.error ? `<span class="v-bad">${esc(l.error)}</span>` : (l.bands.map(b => b.toLocaleString()).join(", ") || esc(l.note))}</td></tr>`).join("")}</tbody></table>
    <p class="note">${esc(r.note)}. Fragments under ~100 bp usually run off or are invisible.</p>`;
}

const RC = {A: "T", C: "G", G: "C", T: "A", U: "A", R: "Y", Y: "R", K: "M", M: "K", B: "V", V: "B", D: "H", H: "D", S: "S", W: "W", N: "N"};
const revComp = s => [...s].reverse().map(c => { const u = RC[c.toUpperCase()] || c; return c === c.toLowerCase() ? u.toLowerCase() : u; }).join("");

// the selected bases, top strand: a selection is 1-based and inclusive, and may wrap the origin (end < start)
function selTop() {
  const s = current?.seq, r = selRegion;
  if (!s || !r) return "";
  return r.end >= r.start ? s.slice(r.start - 1, r.end) : s.slice(r.start - 1) + s.slice(0, r.end);
}
// Ctrl/⌘+C on a map selection copies its bases, 5′→3′ on the selected strand.
// Text selected on the page, or the focus in a text field, copies as usual.
document.addEventListener("copy", e => {
  const a = document.activeElement;
  if (!selRegion || !current?.seq || String(getSelection()) || a?.matches?.("input, textarea, select")) return;
  const top = selTop(), text = selRegion.sense === "-" ? revComp(top) : top;
  e.clipboardData.setData("text/plain", text);
  e.preventDefault();
  const el = $("#zsel");
  if (el) { showSelection(); el.insertAdjacentHTML("beforeend", ` · <span class="v-good">${text.length.toLocaleString()} bp copied</span>`); }
});

function paneSequence() {
  const s = current.seq, lines = [], L = s.length;
  for (let i = 0; i < L; i += 60) lines.push(String(i + 1).padStart(7) + "  " + s.slice(i, i + 60).replace(/(.{10})/g, "$1 "));
  const name = current.plasmid_id || current.name || "map";
  const sel = selTop();
  const selText = sel && (selRegion.sense === "-" ? revComp(sel) : sel);
  $("#pane").innerHTML = `<div class="controls">
      <button id="cpseq">Copy sequence</button> <button id="cpfa">Copy as FASTA</button> <button id="cprc" title="the whole map, reverse complement, 5′→3′">Copy reverse complement</button>
      ${sel ? `<button id="cpsel" title="${esc(selRegion.label || "selection")} ${selRegion.start}..${selRegion.end}">Copy selection (${sel.length.toLocaleString()} bp${selRegion.sense === "-" ? ", − strand 5′→3′" : ""})</button> <button id="cpselrc">… reverse complement</button>` : `<span class="note">Select a region on the map to copy just that.</span>`}
      <span class="note" id="cpmsg"></span></div>
    <div class="seq">${esc(lines.join("\n"))}</div>`;
  const copy = async (text, what) => {
    try { await navigator.clipboard.writeText(text); $("#cpmsg").innerHTML = `<span class="v-good">${esc(what)} copied</span>`; }
    catch (e) { $("#cpmsg").innerHTML = `<span class="v-bad">The browser refused the clipboard: select the text below and copy it by hand.</span>`; }
  };
  $("#cpseq").onclick = () => copy(s, `${L.toLocaleString()} bp`);
  $("#cpfa").onclick = () => copy(`>${name} ${L} bp\n${s.match(/.{1,60}/g).join("\n")}\n`, "FASTA");
  $("#cprc").onclick = () => copy(revComp(s), `reverse complement, ${L.toLocaleString()} bp`);
  if (sel) $("#cpsel").onclick = () => copy(selText, `selection, ${sel.length.toLocaleString()} bp`);
  if (sel) $("#cpselrc").onclick = () => copy(revComp(selText), `selection, reverse complement`);
}

function paneVerify() {
  $("#pane").innerHTML = `
    <div class="drop" id="drop">Drop Sanger reads (.ab1, .fasta, .fastq) or a whole-plasmid consensus (.fasta, .gbk) here, or <input type="file" id="files" multiple></div>
    <div class="controls">
      <label>Mode <select id="mode"><option value="auto">auto (by length)</option><option value="read">Sanger / partial read</option><option value="whole">whole plasmid</option></select></label>
      <button class="primary" id="go" disabled>Compare with ${esc(current.plasmid_id || "map")}</button>
      <span class="note">Read ends are quality-trimmed (Mott). IUPAC codes count as matches. Whole-plasmid homopolymer indels are shown but not counted.</span>
    </div>
    <div id="readnames"></div>
    <div id="results"></div>`;
  // the reads and the last result stay while this map is open; a new Compare, other reads or another map replace them
  const keep = verifyKeep && verifyKeep.key === current.key ? verifyKeep : null;
  let files = keep ? keep.files : [], last = keep ? keep.last : null;
  // each read is named after its file, and the name can be changed here, before or after Compare
  //
  const names = keep ? keep.names : new Map();
  const showNames = () => {
    $("#readnames").innerHTML = files.length ? `<div class="card"><b>Read names</b> <span class="note">from the file names; change them to what you want to see in the results (e.g. the barcode or colony)</span>
      <div class="controls" style="margin:6px 0 0;flex-wrap:wrap">${files.map((f, i) => `<label title="${esc(f.name)}"><input type="text" data-rn="${i}" value="${esc(names.get(f.name))}" style="width:170px"></label>`).join("")}</div></div>` : "";
    $("#readnames").querySelectorAll("[data-rn]").forEach(inp => inp.onchange = () => {
      names.set(files[+inp.dataset.rn].name, inp.value.trim() || stemOf(files[+inp.dataset.rn].name));
      if (last) renderVerify(last, files, names);
    });
  };
  const stemOf = n => n.replace(/\.[^.]+$/, "");
  const showFiles = () => { $("#go").disabled = !files.length; if (files.length) $("#drop").firstChild.textContent = files.map(f => f.name).join(", ") + " — "; };
  const setFiles = fl => { files = [...fl]; last = null; names.clear(); files.forEach(f => names.set(f.name, stemOf(f.name))); showNames(); showFiles();
    verifyKeep = {key: current.key, files, names, last: null, mode: $("#mode").value}; };
  $("#files").onchange = e => setFiles(e.target.files);
  const d = $("#drop");
  d.ondragover = e => { e.preventDefault(); d.classList.add("over"); };
  d.ondragleave = () => d.classList.remove("over");
  d.ondrop = e => { e.preventDefault(); d.classList.remove("over"); setFiles(e.dataTransfer.files); };
  $("#go").onclick = async () => {
    const fd = new FormData(); files.forEach(f => fd.append("files", f)); fd.append("mode", $("#mode").value);
    $("#results").innerHTML = `<p class="note">Aligning…</p>`;
    try { last = await api(`/api/maps/${current.key}/verify`, {method: "POST", body: fd});
      verifyKeep = {key: current.key, files, names, last, mode: $("#mode").value}; renderVerify(last, files, names); }
    catch (e) { $("#results").innerHTML = `<p class="v-bad">${esc(e.message)}</p>`; }
  };
  if (keep) {
    $("#mode").value = keep.mode || "auto";
    showNames(); showFiles();
    if (last) renderVerify(last, files, names);
  }
}
let verifyKeep = null;  // {key, files, names, last, mode}: Verify clone's reads and result for the open map

/* The reads stacked under the reference, base by base: the map's features on top,
   then the reference, then one row per read, sorted by where it starts, so reads from one primer (ten
   colonies) line up column by column. Columns run along the map; a circular map is cut at a spot no
   read covers, so no read is split. 40 bp of the map is shown beyond the reads on each side. */
let stackDots = false;
function stackView(ok) {
  const box = $("#stack"); if (!box) return;
  const L = current.length, seq = current.seq.toUpperCase(), circ = current.topology !== "linear";
  const rows = ok.filter(r => r.blocks && r.blocks.length && r.query).sort((a, b) => a.ref_start - b.ref_start);
  if (!rows.length || !seq) { box.innerHTML = ""; return; }
  const cov = new Uint8Array(L + 1);
  const placed = rows.map(r => {
    const m = new Map(), q = r.query.toUpperCase();
    for (const [mp, qp, n] of r.blocks) for (let k = 0; k < n; k++) { const p = (mp - 1 + k) % L + 1; m.set(p, q[(qp - 1 + k) % q.length]); cov[p] = 1; }
    return m;
  });
  let cut = 0;
  if (circ) for (let p = 1; p <= L; p++) if (!cov[p]) { cut = p; break; }
  const lin = p => circ ? (p - cut - 1 + L) % L : p - 1, posAt = c => circ ? (c + cut) % L + 1 : c + 1;
  let lo = Infinity, hi = -1;
  for (let p = 1; p <= L; p++) if (cov[p]) { lo = Math.min(lo, lin(p)); hi = Math.max(hi, lin(p)); }
  lo = Math.max(0, lo - 40); hi = Math.min(L - 1, hi + 40);
  const W = hi - lo + 1, nm = t => `<span class="stkn" title="${esc(t)}">${esc(t)}</span>`;
  // ruler: a tick every 10 bases, the position above every 50
  let tick = "", num = "";
  for (let c = lo; c <= hi; c++) { const p = posAt(c); tick += p % 10 === 0 ? "|" : p % 5 === 0 ? "·" : " "; }
  for (let c = lo; c <= hi;) { const p = posAt(c); if (p % 50 === 0 && c + String(p).length <= hi + 1) { num += p; c += String(p).length; } else { num += " "; c++; } }
  // features: coloured runs with their label inside
  const fs = shown(current).filter(f => f.type !== "source");
  const inF = (f, p) => f.end >= f.start ? p > f.start && p <= f.end : p > f.start || p <= f.end;
  let feat = "", run = null;
  const flush = () => { if (!run) return; const w = run.n;
    // the label every 60 columns, so it stays in view however far the row is scrolled
    const unit = run.f ? (" " + run.f.label + " ").padEnd(60, "─") : "";
    const txt = run.f ? unit.repeat(Math.ceil(w / 60)).slice(0, w) : " ".repeat(w);
    feat += run.f ? `<span class="ft" style="background:var(${FCOL(run.f.type)})" title="${esc(run.f.label)} (${esc(run.f.type)})">${esc(txt)}</span>` : txt; run = null; };
  for (let c = lo; c <= hi; c++) {
    const p = posAt(c), f = fs.find(x => inF(x, p)) || null;
    if (run && run.f === f) run.n++; else { flush(); run = {f, n: 1}; }
  }
  flush();
  const refLine = Array.from({length: W}, (_, i) => seq[posAt(lo + i) - 1]).join("");
  const readLine = (r, m) => {
    const ins = new Map(r.discrepancies.filter(d => d.kind === "insertion").map(d => [d.ref_pos, d.query_bases]));
    const ls = [...m.keys()].map(lin), a = Math.min(...ls), b = Math.max(...ls);
    let out = "";
    for (let c = lo; c <= hi; c++) {
      if (c < a || c > b) { out += " "; continue; }
      const p = posAt(c), base = m.get(p), ref = seq[p - 1];
      const shownBase = base == null ? "-" : stackDots && base === ref ? "." : base;
      const cls = (base == null || (base !== ref && base !== "N") ? "mm" : "") + (ins.has(p) ? " ins" : "");
      out += cls.trim() ? `<span class="${cls.trim()}"${ins.has(p) ? ` title="${esc(ins.get(p))} inserted after ${p}"` : ` title="${p}: map ${ref}, read ${base ?? "deleted"}"`}>${shownBase}</span>` : shownBase;
    }
    return out;
  };
  box.innerHTML = `<div class="card"><b>Reads against the map</b> <span class="note">${posAt(lo).toLocaleString()}–${posAt(hi).toLocaleString()}
      · differences in red, a red bar after a base marks an insertion · scroll sideways</span>
    <label class="note" style="margin-left:8px"><input type="checkbox" id="stkdots"${stackDots ? " checked" : ""}> dots for matching bases</label>
    <div class="stk"><div>${nm("")}${num}</div><div>${nm("")}${tick}</div><div>${nm("features")}${feat}</div>
      <div>${nm(current.plasmid_id || current.name || "map")}<b>${refLine}</b></div>
      ${rows.map((r, i) => `<div>${nm(`${r.query_name} ${r.strand === "-" ? "←" : "→"}`)}${readLine(r, placed[i])}</div>`).join("")}</div></div>`;
  $("#stkdots").onchange = e => { stackDots = e.target.checked; stackView(ok); };
}

function ctx(ref, qry) {
  let a = "", b = "";
  for (let i = 0; i < ref.length; i++) {
    const x = ref[i] !== qry[i];
    a += x ? `<span class="x">${esc(ref[i])}</span>` : esc(ref[i]);
    b += x ? `<span class="x">${esc(qry[i] ?? "")}</span>` : esc(qry[i] ?? "");
  }
  return `<div class="ctx">map   ${a}\nclone ${b}</div>`;
}

function renderVerify(results, files = [], names = null) {
  if (names) {  // the user's read names; a file holding several reads keeps each read's own name after it
    const per = results.reduce((a, r) => (a[r.file] = (a[r.file] || 0) + 1, a), {});
    results.forEach(r => { r.orig_name ??= r.query_name; const n = names.get(r.file);
      r.query_name = !n ? r.orig_name : per[r.file] > 1 ? `${n} ${r.orig_name}` : n; });
  }
  overlay = [];
  results.forEach(r => {
    if (r.error) return;
    overlay.push({kind: "region", start: r.ref_start, end: r.ref_end});
    r.discrepancies.forEach(d => overlay.push({kind: "tick", pos: d.ref_pos, color: d.homopolymer ? "--warn" : "--bad"}));
  });
  redrawMap();
  const ok = results.filter(r => !r.error);
  const multi = ok.length > 1 ? (() => {
    const all = ok.flatMap(r => r.discrepancies);
    const lone = all.filter(d => d.covered_by > 1 && d.seen_in === 1).length, shared = all.filter(d => d.seen_in > 1).length;
    return `<div class="card"><b>${ok.length} reads against ${esc(current.plasmid_id || "this map")}.</b>
      <span class="note">A change seen in only one of several reads covering it is more likely a misread; open its trace to check.
      A change every covering read agrees on is more likely real.</span>
      <div style="margin-top:4px">${shared ? `<span class="badge b-bad">${shared} change(s) seen in more than one read</span>` : `<span class="badge b-good">no change is shared by two reads</span>`}
      ${lone ? ` <span class="badge b-warn">${lone} change(s) in one read only, though others cover it</span>` : ""}</div></div>`;
  })() : "";
  $("#results").innerHTML = multi + `<div id="stack"></div>` + results.map((r, ri) => {
    if (r.error) return `<div class="card"><h3>${esc(r.file)}</h3><p class="v-bad">${esc(r.error)}</p></div>`;
    const cls = r.verdict === "perfect match" ? "v-good" : r.verdict === "no match" ? "v-bad" : "v-warn";
    const rows = r.discrepancies.map((d, di) => `<tr><td>${esc(d.kind)}${d.homopolymer ? ` <span class="badge b-warn">homopolymer</span>` : ""}</td>
      <td class="num">${d.ref_pos}</td><td>${esc(d.ref_bases)} → ${esc(d.query_bases)}</td>
      <td class="num">${d.quality ?? ""}</td><td>${supportBadge(d)}</td><td>${esc(d.features.join(", "))}</td><td>${ctx(d.context_ref, d.context_query)}</td>
      <td>${d.trace ? `<button data-tr="${ri}/${di}">trace</button>` : ""}</td></tr>
      <tr hidden data-trrow="${ri}/${di}"><td colspan="8"></td></tr>`).join("");
    return `<div class="card">
      <h3>${esc(r.query_name)} <span class="note">${esc(r.file)}</span></h3>
      <div><span class="verdict ${cls}">${esc(r.verdict)}</span> · ${r.mode === "whole" ? "whole plasmid" : "read"} · strand ${r.strand} ·
        ${r.mode === "whole" ? "full length" : `map ${r.ref_start.toLocaleString()}–${r.ref_end.toLocaleString()}`} · identity ${(r.identity * 100).toFixed(2)}% · ${r.query_length.toLocaleString()} bp
        ${r.trimmed[0] || r.trimmed[1] ? ` · trimmed ${r.trimmed[0]}/${r.trimmed[1]}` : ""}</div>
      ${r.warnings.map(w => `<div class="msgs">${esc(w)}</div>`).join("")}
      ${r.file && /\.ab[1i!]$/i.test(r.file) && !r.has_trace ? `<div class="note">This .ab1 file has no peak table, so traces cannot be shown for it.</div>` : ""}
      ${r.has_trace ? `<div style="margin-top:6px"><button data-chrom="${ri}">show chromatogram</button></div><div class="chrom" data-chromrow="${ri}" hidden></div>` : ""}
      ${rows ? `<table style="margin-top:8px"><thead><tr><th>Type</th><th class="num">Map pos</th><th>Change</th><th class="num">Q</th><th>Reads</th><th>In feature</th><th>Context</th><th></th></tr></thead><tbody>${rows}</tbody></table>` : ""}
    </div>`;
  }).join("");
  stackView(ok);
  $("#results").querySelectorAll("[data-tr]").forEach(btn => btn.onclick = () => {
    const [ri, di] = btn.dataset.tr.split("/").map(Number), row = $(`[data-trrow="${btn.dataset.tr}"]`);
    row.hidden = !row.hidden;
    if (!row.hidden) row.firstElementChild.innerHTML = traceSvg(results[ri].discrepancies[di]);
  });
  $("#results").querySelectorAll("[data-chrom]").forEach(btn => btn.onclick = async () => {
    const ri = +btn.dataset.chrom, r = results[ri], box = $(`[data-chromrow="${ri}"]`);
    box.hidden = !box.hidden;
    btn.textContent = box.hidden ? "show chromatogram" : "hide chromatogram";
    if (box.hidden || box.dataset.loaded) return;
    const f = files.find(x => x.name === r.file);
    if (!f) { box.innerHTML = `<p class="note">Choose the file again to load its trace.</p>`; return; }
    const fd = new FormData(); fd.append("file", f); fd.append("strand", r.strand);
    box.innerHTML = `<p class="note">Loading trace…</p>`;
    try { chromView(box, r, await api("/api/trace", {method: "POST", body: fd})); box.dataset.loaded = "1"; }
    catch (e) { box.innerHTML = `<p class="v-bad">${esc(e.message)}</p>`; }
  });
}

/* The whole chromatogram of one read in map orientation, scrollable. Rows: map position, map base,
   read base, then the four channels over grey quality bars. Differences from the map are shaded. */
function chromView(box, r, t) {
  const n = t.bases.length, L = current.length, seq = current.seq;
  const refpos = new Array(n).fill(0), dels = new Map();  // dels: read index -> map bases missing before it
  r.blocks.forEach(([rp, qp, len]) => { for (let k = 0; k < len; k++) refpos[(qp - 1 + k) % n] = (rp - 1 + k) % L + 1; });
  const bl = [...r.blocks].sort((a, b) => a[1] - b[1]);
  for (let k = 1; k < bl.length; k++) {
    const [rp, qp, len] = bl[k - 1], [rp2, qp2] = bl[k], gap = ((rp2 - (rp + len)) % L + L) % L;
    if (gap && qp2 === qp + len) dels.set(qp2 - 1, gap);
  }
  // read bases outside the aligned stretch (unaligned ends) are drawn but never counted as changes
  const qa = bl.length ? bl[0][1] - 1 : 0, qb = bl.length ? bl[bl.length - 1][1] - 1 + bl[bl.length - 1][2] : 0;
  const aligned = i => r.mode === "whole" || (i >= qa && i < qb);
  const diff = i => aligned(i) && (!refpos[i] || !compatibleBase(seq[refpos[i] - 1], t.bases[i]));
  const marks = [...Array(n).keys()].filter(i => diff(i) || dels.has(i));
  box.innerHTML = `<div class="controls" style="margin-top:8px">
      <button data-z="-">−</button><button data-z="+">+</button> zoom
      <button data-g="-">−</button><button data-g="+">+</button> height
      <label>map position <input type="number" class="cpos" min="1" max="${L}" style="width:90px"></label><button data-go>go</button>
      ${marks.length ? `<button data-m="-">◀ change</button><button data-m="+">change ▶</button> <span class="note">${marks.length} difference(s) from the map</span>` : `<span class="note">no differences from the map</span>`}
      <span class="note cwhere"></span></div>
    <div class="cscroll" style="overflow-x:auto;position:relative;border:1px solid var(--line);border-radius:6px;background:var(--panel)">
      <div class="cwide" style="height:200px"><canvas style="position:sticky;left:0;display:block;height:200px"></canvas></div></div>`;
  const sc = box.querySelector(".cscroll"), wide = box.querySelector(".cwide"), cv = box.querySelector("canvas");
  let pxb = 14, gain = 1;
  const H = 200, yRef = 30, yRead = 46, top = 56, base = H - 6;
  const col = {A: "#2f9e44", C: "#1c7ed6", G: css("--ink"), T: "#e03131"};
  const layout = () => { wide.style.width = `${n * pxb}px`; draw(); };
  function draw() {
    const cw = sc.clientWidth, dpr = window.devicePixelRatio || 1, sl = sc.scrollLeft;
    cv.width = cw * dpr; cv.height = H * dpr; cv.style.width = `${cw}px`;
    const g = cv.getContext("2d"); g.scale(dpr, dpr);
    const i0 = Math.max(0, Math.floor(sl / pxb) - 1), i1 = Math.min(n - 1, Math.ceil((sl + cw) / pxb) + 1);
    const xc = i => i * pxb + pxb / 2 - sl;
    g.font = `${Math.min(13, pxb)}px ${css("--mono") || "monospace"}`; g.textAlign = "center";
    for (let i = i0; i <= i1; i++) {
      if (t.qual[i] != null) { g.fillStyle = css("--line"); const h = Math.min(60, t.qual[i]) / 60 * (base - top); g.fillRect(xc(i) - pxb / 2 + 1, base - h, pxb - 2, h); }
      if (diff(i)) { g.fillStyle = css("--bad-soft"); g.fillRect(xc(i) - pxb / 2, yRef - 12, pxb, base - yRef + 12); }
    }
    // channels: samples between peak j and j+1 are placed proportionally between base centres
    const pk = t.peaks, s0 = i0 > 0 ? pk[i0 - 1] : 0, s1 = i1 < n - 1 ? pk[i1 + 1] : Math.max(...Object.values(t.channels).map(v => v.length)) - 1;
    let mx = 1;
    for (const v of Object.values(t.channels)) for (let s = s0; s <= s1 && s < v.length; s++) if (v[s] > mx) mx = v[s];
    const ys = v => base - Math.min(1, v / mx * gain) * (base - top);
    for (const [b, v] of Object.entries(t.channels)) {
      g.beginPath(); g.strokeStyle = col[b] || "#888"; g.lineWidth = 1.2;
      let j = Math.max(0, i0 - 1);
      for (let s = s0; s <= s1 && s < v.length; s++) {
        while (j < n - 1 && pk[j + 1] <= s) j++;
        const x = s < pk[0] ? xc(0) - (pk[0] - s) / Math.max(1, pk[1] - pk[0]) * pxb
          : j >= n - 1 ? xc(n - 1) + (s - pk[n - 1]) / Math.max(1, pk[n - 1] - pk[n - 2]) * pxb
          : xc(j) + (s - pk[j]) / Math.max(1, pk[j + 1] - pk[j]) * pxb;
        s === s0 ? g.moveTo(x, ys(v[s])) : g.lineTo(x, ys(v[s]));
      }
      g.stroke();
    }
    const letters = pxb >= 7, step = pxb >= 10 ? 10 : pxb >= 3 ? 50 : 100;
    for (let i = i0; i <= i1; i++) {
      const x = xc(i), p = refpos[i], d = diff(i);
      if (p && p % step === 0) { g.fillStyle = css("--muted"); g.fillText(p.toLocaleString(), x, 12); g.fillRect(x - .5, 15, 1, 4); }
      if (letters) {
        g.font = `${d ? "bold " : ""}${Math.min(13, pxb)}px ${css("--mono") || "monospace"}`;
        g.fillStyle = d ? css("--bad") : css("--muted"); g.fillText(p ? seq[p - 1] : aligned(i) ? "-" : "", x, yRef);
        g.fillStyle = d ? css("--bad") : col[t.bases[i]] || css("--muted"); g.fillText(t.bases[i], x, yRead);
      }
      if (dels.has(i)) { g.fillStyle = css("--bad"); g.fillRect(x - pxb / 2 - 1, yRef - 12, 2, base - yRef + 12); g.font = `bold 10px sans-serif`; g.fillText(`−${dels.get(i)}`, x - pxb / 2, yRef - 14 < 8 ? 8 : yRef - 14); }
    }
    const a = refpos[Math.min(n - 1, Math.max(0, Math.floor(sl / pxb)))], b = refpos[Math.min(n - 1, Math.floor((sl + cw) / pxb))];
    box.querySelector(".cwhere").textContent = a && b ? `showing map ${a.toLocaleString()}–${b.toLocaleString()}` : "";
  }
  const goto = i => { sc.scrollLeft = Math.max(0, i * pxb - sc.clientWidth / 2); draw(); };
  const centre = () => Math.floor((sc.scrollLeft + sc.clientWidth / 2) / pxb);
  sc.onscroll = draw;
  box.querySelectorAll("[data-z]").forEach(b => b.onclick = () => { const c = centre(); pxb = Math.max(1, Math.min(40, b.dataset.z === "+" ? pxb * 1.5 : pxb / 1.5)); layout(); goto(c); });
  box.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { gain = Math.max(.25, Math.min(16, b.dataset.g === "+" ? gain * 1.5 : gain / 1.5)); draw(); });
  box.querySelectorAll("[data-m]").forEach(b => b.onclick = () => {
    const c = centre(), next = b.dataset.m === "+" ? marks.find(i => i > c) ?? marks[0] : [...marks].reverse().find(i => i < c) ?? marks[marks.length - 1];
    goto(next);
  });
  const jump = () => { const v = +box.querySelector(".cpos").value, i = refpos.indexOf(v); i >= 0 ? goto(i) : box.querySelector(".cwhere").textContent = "that map position is not covered by this read"; };
  box.querySelector("[data-go]").onclick = jump;
  box.querySelector(".cpos").onkeydown = e => { if (e.key === "Enter") jump(); };
  layout();
}

const IUPAC_SET = {A: "A", C: "C", G: "G", T: "T", R: "AG", Y: "CT", S: "CG", W: "AT", K: "GT", M: "AC", B: "CGT", D: "AGT", H: "ACT", V: "ACG", N: "ACGT"};
const compatibleBase = (a, b) => { const x = IUPAC_SET[(a || "").toUpperCase()] || "", y = IUPAC_SET[(b || "").toUpperCase()] || ""; return [...x].some(c => y.includes(c)); };

function supportBadge(d) {
  if (d.covered_by == null) return "";
  const cls = d.covered_by === 1 ? "b-info" : d.seen_in === d.covered_by ? "b-bad" : d.seen_in === 1 ? "b-warn" : "b-info";
  return `<span class="badge ${cls}" title="${d.seen_in} of the ${d.covered_by} read(s) covering this position show the same change">${d.seen_in}/${d.covered_by}</span>`;
}

/* The chromatogram around one change, drawn in map orientation; the changed base is shaded */
function traceSvg(d) {
  const t = d.trace, W = 560, H = 150, top = 8, base = 112;
  const n = Math.max(...Object.values(t.channels).map(v => v.length)), max = Math.max(1, ...Object.values(t.channels).flat());
  const x = i => 10 + i / Math.max(1, n - 1) * (W - 20), y = v => base - v / max * (base - top);
  const col = {A: "#2f9e44", C: "#1c7ed6", G: css("--ink"), T: "#e03131"};
  let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;display:block" role="img" aria-label="chromatogram">`;
  const fp = t.peaks[t.focus], half = t.peaks.length > 1 ? (t.peaks[1] - t.peaks[0]) / 2 : 5;
  s += `<rect x="${x(fp - half)}" y="${top}" width="${x(fp + half) - x(fp - half)}" height="${base - top}" fill="${css("--warn-soft")}"/>`;
  for (const [b, v] of Object.entries(t.channels)) s += `<polyline fill="none" stroke="${col[b] || "#888"}" stroke-width="1.2" points="${v.map((h, i) => `${x(i).toFixed(1)},${y(h).toFixed(1)}`).join(" ")}"/>`;
  t.peaks.forEach((p, i) => s += `<text x="${x(p)}" y="${base + 16}" text-anchor="middle" font-size="12" font-family="${css("--mono")}" font-weight="${i === t.focus ? 700 : 400}" fill="${col[t.bases[i]] || css("--muted")}">${esc(t.bases[i])}</text>`);
  s += `<text x="10" y="${H - 6}" font-size="10" fill="${css("--muted")}">called bases of the read, in map orientation · ${esc(d.ref_bases)} → ${esc(d.query_bases)} at ${d.ref_pos}</text>`;
  return s + `</svg>`;
}

/* ── star: add this map to one of my projects (a link by its PMC/EC ID) ── */
async function starInit(m) {
  const b = $("#star"); if (!b) return;
  const load = () => api(`/api/projects${m.plasmid_id ? `?plasmid_id=${encodeURIComponent(m.plasmid_id)}` : ""}`);
  const paint = ps => { const n = ps.filter(p => p.item_for).length; b.textContent = n ? "★" : "☆"; b.title = n ? `in ${n} project(s): click to change` : "add to a project"; };
  try { paint(await load()); } catch { b.hidden = true; return; }
  b.onclick = async e => {
    e.stopPropagation();
    document.querySelector(".starmenu")?.remove();
    const ps = await load(), r = b.getBoundingClientRect();
    const menu = document.createElement("div");
    menu.className = "starmenu";
    menu.style.left = `${r.left + scrollX}px`; menu.style.top = `${r.bottom + scrollY + 4}px`;
    menu.innerHTML = (ps.map(p => `<div data-p="${p.id}">${p.item_for ? "✓" : "&nbsp;&nbsp;"} ${esc(p.name)} <span class="note">${p.n_items} item(s)</span></div>`).join("")
      || `<div class="note" style="cursor:default">You have no projects yet.</div>`) + `<div><a href="/">＋ new project on the dashboard</a></div>`;
    document.body.append(menu);
    const close = ev => { if (!menu.contains(ev.target)) { menu.remove(); document.removeEventListener("click", close); } };
    document.addEventListener("click", close);
    menu.querySelectorAll("[data-p]").forEach(d => d.onclick = async () => {
      const p = ps.find(x => x.id === +d.dataset.p);
      try {
        if (p.item_for) await api(`/api/projects/${p.id}/items/${p.item_for}`, {method: "DELETE"});
        else await api(`/api/projects/${p.id}/refs`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({key: m.key})});
      } catch (err) { alert(err.message); }
      menu.remove(); document.removeEventListener("click", close);
      paint(await load());
    });
  };
}

/* ── primer design ─────────────────────────────────────────────────── */

const store = {get: k => { try { return localStorage.getItem(k) || ""; } catch { return ""; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }};

/* Fill the Design region from the map selection: a ruler drag, a clicked feature/primer/ORF, or the zoom window */
function useSelection() {
  const m = current, r = selRegion || (zoom ? {start: (Math.floor(zoom.start) % m.length) + 1, end: ((Math.ceil(zoom.start + zoom.width) - 1) % m.length) + 1, sense: "+", label: "region"} : null);
  if (!r) { $("#dresults").innerHTML = `<p class="note">Nothing selected yet: zoom into the map and drag along its ruler (or shift+drag), or click a feature.</p>`; return; }
  $("#dstart").value = r.start; $("#dend").value = r.end; $("#dsense").value = r.sense === "-" ? "-" : "+";
  $("#dfeat").value = ""; if (r.label) $("#dtarget").value = asciiName(r.label);
  $("#dresults").innerHTML = `<p class="note">Region ${r.start.toLocaleString()}–${r.end.toLocaleString()} from the map selection (${esc(r.label || "")}).</p>`;
}

async function runSdm() {
  const aa = document.querySelector("[name=sdmmode]:checked").value === "aa";
  const q = new URLSearchParams({opt_tm: $("#dtm").value});
  if (aa) { q.set("feature", $("#dcds").value || "-1"); q.set("mutation", $("#dmut").value); }
  else { q.set("start", $("#dstart").value); q.set("end", $("#dend").value); q.set("new", $("#dnew").value); }
  if ($("#dmin").value) q.set("min_len", $("#dmin").value);
  if ($("#dmax").value) q.set("max_len", $("#dmax").value);
  if (aa && $("#dcds").value) $("#dtarget").value = asciiName(`${current.features[+$("#dcds").value].label}_${$("#dmut").value}`);
  $("#dresults").innerHTML = `<p class="note">Designing…</p>`;
  padCands = [];
  let r;
  try { r = await api(`/api/maps/${current.key}/sdm?${q}`); }
  catch (e) { $("#dresults").innerHTML = `<p class="v-bad">${esc(e.message)}</p>`; return; }
  showSdm(r);
}

function showSdm(r) {
  const c = r.change, p = r.protein, purpose = `site-directed mutagenesis ${p ? p.notation : `${c.start}-${c.end}`}`;
  const mark = (s, from, n) => `${esc(s.slice(0, from))}<span class="x">${esc(s.slice(from, from + n)) || "|"}</span>${esc(s.slice(from + n))}`;
  const k = Math.min(15, c.start - 1);
  let prot = "";
  if (p) {
    const i = p.protein_before.split("").findIndex((a, j) => a !== p.protein_after[j]);
    const lo = Math.max(0, i - 8);
    prot = `<div class="ctx">wt     ${esc(p.protein_before.slice(lo, i + 12))}
mutant ${esc(p.protein_after.slice(lo, i + 12 + p.protein_after.length - p.protein_before.length))}</div>
      ${p.checks.map(w => `<p class="msgs">⚠ ${esc(w)}</p>`).join("")}
      <p class="note">${esc(p.feature)} ${esc(p.notation)}${p.codons.length ? ` · new codon(s) ${esc(p.codons.join(" "))}` : ""} · ${esc(p.codon_note)}</p>`;
  }
  $("#dresults").innerHTML = `${r.warnings.map(w => `<p class="msgs">⚠ ${esc(w)}</p>`).join("")}
    <div class="card"><h3>${esc(r.kind)} at ${c.start.toLocaleString()}${c.end > c.start ? `–${c.end.toLocaleString()}` : ""}
      <span class="note">${c.old ? esc(c.old) : "—"} → ${c.new ? esc(c.new) : "—"} · mutant plasmid ${r.mutant_length.toLocaleString()} bp</span>
      <button style="float:right;padding:3px 10px" id="sdmdl">download mutant (FASTA)</button></h3>
      ${prot}
      <div class="ctx">map    ${mark(r.context_before, k, c.old.length)}
mutant ${mark(r.context_after, k, c.new.length)}</div>
      <table style="margin-top:8px"><thead><tr><th></th><th>5′→3′ (change lowercase)</th><th class="num">nt</th><th class="num">Tm °C</th><th class="num">GC %</th><th class="num">binds</th><th>checks</th><th></th></tr></thead>
      <tbody>${primerRow(r.forward, "F", primerName("SDM_F"), purpose)}${primerRow(r.reverse, "R", primerName("SDM_R"), purpose)}</tbody></table>
      <p class="note">Back-to-back primers: their 5′ ends meet at the change and the whole plasmid is amplified, then KLD (kinase, ligase, DpnI).
        Tm is for the annealing part only${r.tm_difference != null ? ` · ΔTm ${r.tm_difference}°` : ""}${r.pair_dimer_tm > 45 ? ` · F/R dimer ${r.pair_dimer_tm}°` : ""}.
        Check the annealing temperature in NEB's Tm calculator for Q5. Specificity checked against ${esc(r.checked_against)}.
        After cloning, compare the reads with the downloaded mutant in Verify clone.</p>
    </div>`;
  $("#sdmdl").onclick = () => {
    const name = asciiName(`${current.plasmid_id || "map"}_${$("#dtarget").value || "mutant"}`);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([`>${name}\n${r.mutant_seq.replace(/(.{70})/g, "$1\n")}\n`], {type: "text/plain"}));
    a.download = `${name}.fasta`; a.click(); URL.revokeObjectURL(a.href);
  };
  overlay = [{kind: "region", start: c.start, end: Math.max(c.start, c.end)}, {kind: "tick", pos: c.start, color: "--bad"}];
  zoomRegion(Math.max(1, c.start - 60), Math.min(current.length, c.start + 60)); redrawMap();
}

async function runDesign() {
  if ($("#dtask").value === "sdm") return runSdm();
  const t = $("#dtask").value, g = t === "cloning" ? $("#dgg").value : "";
  const q = new URLSearchParams({task: t, start: $("#dstart").value, end: $("#dend").value, opt_tm: $("#dtm").value,
    max_extra: $("#dflank").value, sense: $("#dsense").value,
    tail_f: g ? "" : $("#dtf").value.replace(/\s/g, ""), tail_r: g ? "" : $("#dtr").value.replace(/\s/g, ""),
    enzyme: g, oh5: g ? $("#doh5").value : "", oh3: g ? $("#doh3").value : ""});
  if ($("#dmin").value) q.set("min_len", $("#dmin").value);
  if ($("#dmax").value) q.set("max_len", $("#dmax").value);
  $("#dresults").innerHTML = `<p class="note">Designing…</p>`;
  padCands = [];
  let r;
  try { r = await api(`/api/maps/${current.key}/design?${q}`); }
  catch (e) { $("#dresults").innerHTML = `<p class="v-bad">${esc(e.message)}</p>`; return; }
  overlay = [{kind: "region", start: r.region[0], end: r.region[1]}];
  r.task === "sequencing" ? showSeqDesign(r) : r.task === "walk" ? showWalk(r) : showPairs(r);
