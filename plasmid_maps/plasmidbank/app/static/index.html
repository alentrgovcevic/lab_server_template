<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1d2327; --muted: #5f6b73; --line: #dde1e4;
  --accent: #2b7a78; --accent-soft: #d8ecea; --on-accent: #fff; --warn: #b7791f; --warn-soft: #fbf0d9;
  --bad: #c0392b; --bad-soft: #f8dedb; --good: #2f855a; --good-soft: #dcefe3;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --f-cds: #4c78a8; --f-promoter: #59a14f; --f-terminator: #e15759; --f-ori: #b07aa1;
  --f-primer: #f28e2b; --f-misc: #9c9c9c; --f-other: #76b7b2;
  --sel: #1f6feb;  /* the selection: vivid, apart from the teal accent */
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15191c; --panel: #1d2327; --ink: #e6e9eb; --muted: #9aa5ad; --line: #333b41;
    --accent: #5fb3b0; --accent-soft: #1f3a3a; --on-accent: #15191c; --warn: #e2b04a; --warn-soft: #3a3020;
    --bad: #f07b6e; --bad-soft: #3d2422; --good: #6cc495; --good-soft: #1e3529;
    --sel: #4d9aff;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
header { display: flex; align-items: baseline; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 17px; margin: 0; }
header .stats { color: var(--muted); font-size: 13px; }
header .tools { display: flex; gap: 6px; flex-wrap: wrap; }
.tool { padding: 3px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); font: inherit; cursor: pointer; }
.tool:hover { border-color: var(--accent); }
.listfoot { padding: 6px 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
/* map card: everyday actions next to the title; rare ones under More (UX review 2026-10-29) */
.actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 6px 0 2px; }
.actions button, .more > summary { font: inherit; font-size: 13px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); cursor: pointer; }
.more { position: relative; }
.more > summary { list-style: none; } .more > summary::-webkit-details-marker { display: none; }
.more[open] > div { position: absolute; z-index: 5; margin-top: 4px; padding: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.2); white-space: nowrap; }
/* empty pane: recent maps and example searches */
.start { max-width: 560px; margin: 50px auto; color: var(--muted); }
.start h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; margin: 18px 0 6px; }
.start .chip { display: inline-block; margin: 2px 4px 2px 0; padding: 3px 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink); cursor: pointer; font: inherit; font-size: 13px; }
.start .chip:hover { border-color: var(--accent); }
.backres { display: none; }
main { display: grid; grid-template-columns: 340px 1fr; height: calc(100vh - 50px); }
aside { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }

.grp > .grp, .grp > .rows { margin-left: 12px; }

@media (hover: none) { .wsact, .wsdir > summary .wsbtn { visibility: visible; } }

td.vis { width: 22px; }

.controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.controls label { color: var(--muted); font-size: 13px; }
.controls input[type=number] { width: 60px; }
input, select, button { font: inherit; color: var(--ink); }
input[type=number], select, input[type=text] { padding: 4px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); }
button.primary { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 6px; padding: 7px 14px; cursor: pointer; }
button.primary:disabled { opacity: .5; cursor: default; }

.askdlg { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); width: min(460px, 92vw); }
.askdlg label { display: block; margin: 8px 0; }
#mapsvg g.hi { filter: drop-shadow(0 0 3px var(--sel)); }
#mapsvg .flabel.hi text { font-weight: 700; fill: var(--sel); }
#mapsvg .flabel.hi polyline { stroke: var(--sel); stroke-width: 1.5; }
.card h3 { margin: 0 0 6px; font-size: 15px; }
.verdict { font-weight: 600; }
.v-good { color: var(--good); } .v-bad { color: var(--bad); } .v-warn { color: var(--warn); }
.ctx { font-family: var(--mono); font-size: 12px; white-space: pre; line-height: 1.25; }
.ctx .x { background: var(--bad-soft); color: var(--bad); font-weight: 700; }
.jrow { padding: 6px 8px; border-left: 3px solid transparent; margin: 4px 0; }
.jrow.jsel { border-left-color: var(--accent); background: var(--accent-soft); }

@media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto; } aside { max-height: 40vh; } .top, .top.big { grid-template-columns: 1fr; }
  body.has-map aside #list, body.has-map aside .listfoot { display: none; }
  .backres { display: inline-block; margin-bottom: 8px; }

  header .stats, aside, .tabs, .controls, .drop { display: none !important; }

<body>
<header><a href="/" class="stats" title="Lab dashboard: projects, toolbox, genome browser, feedback">← Dashboard</a><h1>Plasmid map bank</h1><button id="upbtn" class="primary" style="padding:4px 12px">＋ New map</button><nav class="tools" aria-label="Tools"><button id="ggbtn" class="tool">Golden Gate</button><button id="enzbtn" class="tool">Enzyme finder</button><button id="annbtn" class="tool">Annotations</button></nav><a href="#" id="whatsnewlink" class="stats" style="margin-left:auto" title="What changed in the latest release, with guided tours">What's new</a><a href="/changelog" class="stats" title="Every release, newest first">Changelog</a><a href="#" id="guide" class="stats" title="A one-minute tour of this page">Guide</a><span id="uictl" class="stats" data-always="1"></span><span id="me" class="stats"></span></header>
<main>
  <aside>
    <input id="q" type="search" placeholder="Search ID, name, feature… (e.g. NFR1 pIV10)" autocomplete="off">
    <div id="list"></div>
    <div id="stats" class="listfoot">loading…</div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const api = async (url, opt) => { const r = await fetch(url, opt); if (r.status === 401) { location.href = "/login"; throw new Error("signed out"); } if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText); return r.json(); };
/* Save as new version. The server refuses (409) when the map number now points elsewhere, and asks
   (409 with `newer`) when someone else saved a version after this map was opened. */
/* Name + folder for a file in My workspace; resolves to {label, folder} or null. Folders already in My workspace are offered; a new one can be typed. */
async function askNameFolder(title, label, folder, ok = "Save") {
  let folders = [];
  try {
    const me = (await api("/api/projects")).find(p => p.personal);
    if (me) folders = [...new Set((await api(`/api/projects/${me.id}`)).items.map(i => i.folder).filter(Boolean))].sort();
  } catch (e) { /* single-user mode: no folders to offer */ }
  // every parent of a folder is a folder too ("A/B" offers "A" and "A/B")
  const all = [...new Set(folders.flatMap(f => f.split("/").map((_, i, a) => a.slice(0, i + 1).join("/"))))].sort((a, b) => a.localeCompare(b));
  if (folder && !all.includes(folder)) all.push(folder);
  const d = document.createElement("dialog");
  d.className = "askdlg";
  // folders were hard to find. Pick one, or "＋ new folder" (inside the one picked, or at the top)
  d.innerHTML = `<form method="dialog"><h3 style="margin:0 0 6px">${esc(title)}</h3>
    <label>Name <input type="text" name="label" value="${esc(label)}" style="width:100%" required></label>
    <label>Folder in My workspace <select name="pick" style="width:100%">
      <option value="">(top level)</option>${all.map(f => `<option value="${esc(f)}"${f === folder ? " selected" : ""}>${"    ".repeat(f.split("/").length - 1)}📁 ${esc(f.split("/").pop())}</option>`).join("")}
      <option value="__new__">＋ new folder…</option></select></label>
    <label class="newf" hidden>New folder <input type="text" name="newfolder" placeholder="e.g. L0 modules (a / makes a folder inside a folder)" style="width:100%"></label>
    <p class="note newf" hidden></p>
    <div class="controls" style="justify-content:flex-end;margin:0"><button value="cancel" formnovalidate>Cancel</button><button value="ok" class="primary">${esc(ok)}</button></div></form>`;
  document.body.append(d);
  const pick = d.querySelector("[name=pick]"), nf = d.querySelector("[name=newfolder]");
  let parent = folder || "";
  const sync = () => {
    const isNew = pick.value === "__new__";  // a real folder never starts with _ (projects.safe_folder)
    if (!isNew) parent = pick.value;
    d.querySelectorAll(".newf").forEach(el => el.hidden = !isNew);
    d.querySelector("p.newf").textContent = parent ? `It goes inside "${parent}". To put it at the top level, pick (top level) first, then ＋ new folder.` : "It goes at the top level of My workspace.";
    if (isNew) nf.focus();
  };
  pick.onchange = sync; sync();
  d.showModal();
  return new Promise(res => d.onclose = () => {
    const f = new FormData(d.querySelector("form")), isNew = f.get("pick") === "__new__";
    const typed = String(f.get("newfolder") || "").trim().replace(/^\/+|\/+$/g, "");
    d.remove();
    const out = isNew ? (typed ? [parent, typed].filter(Boolean).join("/") : parent) : String(f.get("pick"));
    res(d.returnValue === "ok" ? {label: String(f.get("label")).trim(), folder: out} : null);
  });
}

async function saveVersion(body) {
  const send = force => fetch(`/api/maps/${current.key}/save`, {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({...body, expect_file: current.file, opened_at: current.opened_at, force})});
  let r = await send(false);
  if (r.status === 409) {
    const d = await r.json().catch(() => ({}));
    const ask = current.draft ? `${d.detail}\n\nReplace it with your version? (Cancel, then reload the file to see the other edit.)`
      : `${d.detail}\n\nYours is saved as a separate file either way. Save it?`;
    if (!d.newer || !confirm(ask)) throw new Error(d.detail || "not saved");
    r = await send(true);
  }
  if (r.status === 401) { location.href = "/login"; throw new Error("signed out"); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  const res = await r.json();
  current.opened_at = res.saved_at;  // warn again only for versions saved after this one
  return res;
}
const FCOL_KNOWN = {CDS: "--f-cds", gene: "--f-cds", promoter: "--f-promoter", terminator: "--f-terminator", rep_origin: "--f-ori", primer_bind: "--f-primer", misc_feature: "--f-misc"};
/* Your own feature types get a stable colour of their own: a hue from the name, set once as a CSS variable */
const FCOL = t => {
  if (FCOL_KNOWN[t]) return FCOL_KNOWN[t];
  if (!t || ["exon", "intron", "RBS", "LTR", "polyA_signal", "protein_bind"].includes(t)) return "--f-other";
  const v = "--ft-" + t.replace(/[^A-Za-z0-9_-]/g, "_");
  if (!document.documentElement.style.getPropertyValue(v)) {
    let h = 0; for (const c of t) h = (h * 31 + c.charCodeAt(0)) % 360;
    document.documentElement.style.setProperty(v, `hsl(${h} 55% 52%)`);
  }
  return v;
};
const flen = (f, L) => f.end >= f.start ? f.end - f.start : f.end - f.start + L;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

let selRegion = null;  // {start, end, sense, label, strandOnly} last feature/primer clicked, used by Design
let trView = null;  // {start, end, strand, protein}: the selection's translation, drawn as a third row under the bases
let keepRowsScroll = false;  // a selection made in the rows view keeps the rows where they are
let centerRowsOnSel = false;  // Translate: centre the rows on the selection (the rows grow by a line)
let sites = [], siteMode = "off", siteCustom = "";
let current = null, overlay = [], tab = "features", primerCache = {};
// Basic view (2026-10-29): admins tick on /admin which bank tools show in Basic; the rest get class "adv".
let basicView = new Set(["tab:features", "tab:verify", "tab:primers", "tab:sequence", "newmap", "gg"]);
const advIf = id => basicView.has(id) ? "" : " adv";
const TOOL_BTN = {newmap: "#upbtn", gg: "#ggbtn", enzymes: "#enzbtn", annotations: "#annbtn"};
function applyBasicView() {
  for (const [id, sel] of Object.entries(TOOL_BTN)) $(sel)?.classList.toggle("adv", !basicView.has(id));
}
// opening a tool that Basic hides switches to Advanced instead of showing nothing
const needAdvanced = id => { if (!basicView.has(id) && window.pmUI?.view !== "advanced") window.pmUI?.reveal("advanced"); };
let hiddenFeats = new Set(), bigMap = (() => { try { return localStorage.getItem("pm-bigmap") === "1"; } catch (e) { return false; } })(), infoOpen = false, annotOpen = false;  // feature indices switched off in the views; enlarged circular map
const shown = m => m === current ? m.features.filter((f, i) => !hiddenFeats.has(i)) : m.features;
const hidNote = () => hiddenFeats.size ? `${hiddenFeats.size} feature${hiddenFeats.size > 1 ? "s" : ""} hidden` : "";

let myRole = "user";
async function showMe() {
  try {
    const me = await api("/api/me");
    myRole = me.role || "user";
    if (me.auth === "none") return;
    $("#me").innerHTML = `<details style="display:inline-block;position:relative"><summary style="cursor:pointer">${esc(me.user)} · ${me.files.length} saved file(s)</summary>
      <div class="card" style="position:absolute;right:0;z-index:5;min-width:320px;max-height:50vh;overflow:auto">${me.files.length
        ? me.files.map(f => `<div><a href="/api/me/files/${encodeURIComponent(f.name)}">${esc(f.name)}</a></div>`).join("")
        : `<p class="note">Edits you save appear here.</p>`}</div></details> · <a href="/logout">sign out</a>`;
  } catch (e) { /* single-user mode or not reachable */ }
}

  }

  $("#guide").onclick = e => { e.preventDefault(); window.pmTour?.("pmt-bank", BANK_TOUR, true); };

/* The list as folders: PMC in 1000-wide bins named as on the share (PMC7001-8000), EC in
   1000s too (flat on the share, but thousands of maps), maps without a number, then one folder per project.
   A folder draws its rows only when opened: the bank holds ~12,000 maps. */
let listGroups = {}, listRows = [];
const binOf = (n, w) => { const lo = Math.max(0, Math.floor((n - 1) / 1000) * 1000); return [lo, `${String(lo + 1).padStart(w, "0")}-${lo + 1000}`]; };
function groupOf(m) {
  const id = m.plasmid_id || "";
  let x = id.match(/^PMC-?(\d+)$/i);
  if (x) { const [lo, b] = binOf(+x[1], 4); return ["PMC", "PMC" + b, lo]; }
  x = id.match(/^EC-?(\d+)$/i);
  if (x) { const [lo, b] = binOf(+x[1], 5); return ["EC", "EC" + b, lo]; }
  return ["none", "", 0];
}
const itemRow = m => `<div class="item${current && current.key === m.key ? " sel" : ""}" data-k="${m.key}">
      <div><span class="id">${esc(m.plasmid_id || "—")}</span>${badges(m)}</div>
      <div class="nm" title="${esc(m.file)}">${esc(m.file.split("/").pop())}</div></div>`;

async function loadList(q) {
  listRows = await api("/api/maps?q=" + encodeURIComponent(q));
  listGroups = {};
  const tops = {PMC: {}, EC: {}, none: {}};
  for (const m of listRows) {
    const [top, bin, lo] = groupOf(m), g = `${top}|${bin}`;
    (listGroups[g] ||= []).push(m);
    tops[top][bin] = lo;
  }
  const open = q && listRows.length <= 300 ? " open" : "";
  const leaf = (g, label, n) => `<details class="grp" data-g="${esc(g)}"${open}><summary>${esc(label)}<span class="cnt">${n}</span></summary><div class="rows"></div></details>`;
  let html = "";
  for (const top of ["PMC", "EC"]) {
    const bins = Object.entries(tops[top]).sort((a, b) => a[1] - b[1]);
    if (!bins.length) continue;
    const n = bins.reduce((s, [b]) => s + listGroups[`${top}|${b}`].length, 0);
    html += `<details class="grp"${open}><summary>${top}<span class="cnt">${n.toLocaleString()}</span></summary>`
      + bins.map(([b]) => leaf(`${top}|${b}`, b, listGroups[`${top}|${b}`].length)).join("") + `</details>`;
  }
  if (listGroups["none|"]) html += leaf("none|", "No PMC/EC number", listGroups["none|"].length);
  if (!q) html += `<div id="projfolders"></div>`;
  $("#list").innerHTML = html || `<div class="empty">No matches.</div>`;
  $("#list").querySelectorAll("details[data-g][open]").forEach(fillGroup);
  if (!q) loadProjectFolders();
}

function fillGroup(d) {
  if (d.dataset.filled || !d.open) return;
  d.dataset.filled = 1;
  const rows = (listGroups[d.dataset.g] || []).slice().sort((a, b) => (a.plasmid_id || a.file).localeCompare(b.plasmid_id || b.file, undefined, {numeric: true}));
  const box = d.querySelector(".rows");
  box.innerHTML = rows.map(itemRow).join("");
  box.querySelectorAll(".item").forEach(el => el.onclick = () => openMap(+el.dataset.k));
}

async function loadProjectFolders() {
  myFilesP = null;  // the pickers fetch the files again
  let ps = [];
  try { ps = await api("/api/projects"); } catch (e) { return; }  // single-user mode or no projects store
  const box = $("#projfolders");
  if (!box) return;
  box.innerHTML = ps.map(p => `<details class="grp" data-p="${p.id}"><summary>${p.personal ? "🔒 " : "📁 "}${esc(p.name)}<span class="cnt">${p.n_items}</span></summary><div class="rows note" style="padding:6px 14px">loading…</div></details>`).join("");
}

async function fillProject(d) {
  if (d.dataset.filled || !d.open) return;
  d.dataset.filled = 1;
  const box = d.querySelector(".rows");
  try {
    const p = await api(`/api/projects/${d.dataset.p}`);
    box.classList.remove("note"); box.style.padding = "";
    if (p.personal) { wsTree(d, p); return; }
    const items = p.items;
    box.innerHTML = items.map(it => it.key != null
      ? `<div class="item${current && current.key === it.key ? " sel" : ""}" data-k="${it.key}"><div><span class="id">${it.kind === "draft" ? (it.folder ? `📁 ${esc(it.folder)}` : "draft") : esc(it.plasmid_id || "—")}</span></div><div class="nm">${esc(it.label || it.name || it.file || "")}</div></div>`
      : `<a class="item" style="display:block;color:inherit;text-decoration:none" href="/#project/${p.id}" title="drafts open on the dashboard"><div><span class="id">${it.kind === "draft" ? "draft" : "—"}</span> <span class="badge b-info">private</span></div><div class="nm">${esc(it.label || it.name || "")}</div></a>`).join("")
      || `<div class="note" style="padding:6px 14px">Empty. Add maps with ☆ on a map, or upload without a number for a draft.</div>`;
    box.querySelectorAll(".item[data-k]").forEach(el => el.onclick = () => openMap(+el.dataset.k));
  } catch (e) { box.textContent = e.message; }
}

/* My workspace as a folder tree. Files can be renamed, duplicated and moved, and folders renamed, right here. */
const wsOpen = new Set();  // open folders, by path, kept across redraws
function wsTree(d, p) {
  const box = d.querySelector(".rows"), root = {dirs: {}, files: [], path: ""};
  for (const it of p.items) {
    let node = root;
    for (const part of (it.folder || "").split("/").filter(Boolean)) {
      const path = node.path ? `${node.path}/${part}` : part;
      node = node.dirs[part] ||= {dirs: {}, files: [], path};
    }
    node.files.push(it);
  }
  const count = n => n.files.length + Object.values(n.dirs).reduce((s, x) => s + count(x), 0);
  const holds = (n, k) => n.files.some(it => it.key === k) || Object.values(n.dirs).some(x => holds(x, k));
  const act = (a, t, txt) => `<button class="wsbtn" data-act="${a}" title="${t}">${txt}</button>`;
  const file = it => it.key != null
    ? `<div class="item wsitem${current && current.key === it.key ? " sel" : ""}" data-k="${it.key}" data-item="${it.id}"${it.kind === "draft" ? ' draggable="true"' : ""}>
        <div class="wsrow"><span class="nm" title="${esc(it.label || it.name || "")}">${it.kind === "draft" ? "📄" : "🔗"} ${esc(it.label || it.name || it.file || "")}</span>
        ${it.kind === "draft" ? `<span class="wsact">${act("rename", "rename this file", "✎")}${act("dup", "duplicate: a copy to change (e.g. one per mutant)", "⧉")}${act("move", "move to another folder", "↦")}</span>` : ""}</div></div>`
    : `<a class="item" style="display:block;color:inherit;text-decoration:none" href="/#project/${p.id}" title="opens on the dashboard"><div class="nm">${esc(it.label || it.name || "")}</div></a>`;
  const dir = (name, n) => `<details class="grp wsdir" data-folder="${esc(n.path)}"${wsOpen.has(n.path) || (current && holds(n, current.key)) ? " open" : ""}>
      <summary draggable="true">📁 ${esc(name)}<span class="cnt">${count(n)}</span>${act("rfolder", "rename this folder (a / moves it into another folder)", "✎")}</summary><div class="rows">${render(n)}</div></details>`;
  const render = n => Object.entries(n.dirs).sort((a, b) => a[0].localeCompare(b[0], undefined, {numeric: true})).map(([k, x]) => dir(k, x)).join("")
    + n.files.slice().sort((a, b) => (a.label || "").localeCompare(b.label || "", undefined, {numeric: true})).map(file).join("");
  box.innerHTML = render(root) || `<div class="note" style="padding:6px 14px">Empty. Upload without a lab ID, or use “Save to My workspace…” on any map.</div>`;
  const redraw = async () => { delete d.dataset.filled; await fillProject(d); };
  const post = (url, body) => api(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  box.querySelectorAll(".item[data-k]").forEach(el => el.onclick = () => openMap(+el.dataset.k));
  box.querySelectorAll("details.wsdir").forEach(x => x.ontoggle = () => x.open ? wsOpen.add(x.dataset.folder) : wsOpen.delete(x.dataset.folder));
  // drag and drop: a file or a folder onto a folder, or onto "My workspace" for the top level.
  // Touch screens have no HTML drag and drop; the ↦ and ✎ buttons do the same there.
  let dragged = null;
  box.querySelectorAll(".wsitem[draggable], details.wsdir > summary").forEach(el => {
    el.ondragstart = e => {
      e.stopPropagation();
      dragged = el.matches(".wsitem") ? {item: p.items.find(x => x.id === +el.dataset.item)} : {folder: el.parentElement.dataset.folder};
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", dragged.folder ?? dragged.item.label ?? "");
    };
    el.ondragend = () => { dragged = null; d.querySelectorAll(".dropok").forEach(x => x.classList.remove("dropok")); };
  });
  const targets = [d.querySelector(":scope > summary"), ...box.querySelectorAll("details.wsdir > summary")];
  const targetOf = s => s.parentElement.classList.contains("wsdir") ? s.parentElement.dataset.folder : "";
  const allowed = to => dragged && (dragged.item ? (dragged.item.folder || "") !== to
    : to !== dragged.folder && !(to + "/").startsWith(dragged.folder + "/") && to !== dragged.folder.split("/").slice(0, -1).join("/"));
  targets.forEach(s => {
    s.ondragover = e => { if (allowed(targetOf(s))) { e.preventDefault(); e.dataTransfer.dropEffect = "move"; s.classList.add("dropok"); } };
    s.ondragleave = () => s.classList.remove("dropok");
    s.ondrop = async e => {
      e.preventDefault(); e.stopPropagation(); s.classList.remove("dropok");
      const to = targetOf(s), drag = dragged, ok = allowed(to);
      dragged = null;
      if (!ok) return;
      try {
        if (drag.item) await post(`/api/projects/${p.id}/items/${drag.item.id}/move`, {folder: to});
        else {
          const nw = [to, drag.folder.split("/").pop()].filter(Boolean).join("/");
          await post(`/api/projects/${p.id}/folders/rename`, {old: drag.folder, new: nw});
          for (const f of [...wsOpen]) if (f === drag.folder || f.startsWith(drag.folder + "/")) { wsOpen.delete(f); wsOpen.add(nw + f.slice(drag.folder.length)); }
        }
      } catch (err) { alert(err.message); return; }
      if (to) wsOpen.add(to);
      d.open = true;
      await redraw();
      if (current && current.key < 0) openMap(current.key);
    };
  });
  box.querySelectorAll(".wsbtn").forEach(b => b.onclick = async e => {
    e.preventDefault(); e.stopPropagation();  // not the row's open-map, not the folder's open/close
    const row = b.closest(".item"), it = row && p.items.find(x => x.id === +row.dataset.item);
    try {
      if (b.dataset.act === "rfolder") {
        const old = b.closest("details").dataset.folder, nw = prompt(`Rename the folder "${old}" (and what is in it). A / puts it inside another folder.`, old);
        if (!nw || nw.trim() === old) return;
        await post(`/api/projects/${p.id}/folders/rename`, {old, new: nw});
        for (const f of [...wsOpen]) if (f === old || f.startsWith(old + "/")) { wsOpen.delete(f); wsOpen.add(nw.trim() + f.slice(old.length)); }
      } else if (b.dataset.act === "rename") {
        const nw = prompt("New name", it.label || "");
        if (!nw || !nw.trim()) return;
        await post(`/api/projects/${p.id}/items/${it.id}/move`, {label: nw});
      } else if (b.dataset.act === "move") {
        const a = await askNameFolder("Move or rename", it.label || "", it.folder || "", "Move");
        if (!a) return;
        await post(`/api/projects/${p.id}/items/${it.id}/move`, a);
        if (a.folder) wsOpen.add(a.folder);
      } else if (b.dataset.act === "dup") {
        const a = await askNameFolder("Duplicate", `${it.label || "map"} copy`, it.folder || "", "Duplicate");
        if (!a) return;
        await post(`/api/maps/${it.key}/copy`, a);
        if (a.folder) wsOpen.add(a.folder);
      }
    } catch (err) { alert(err.message); return; }
    await redraw();
    if (current && current.key < 0) openMap(current.key);  // the open file's name or folder may have changed
  });
}

function revealInList(key) {
  if (document.querySelector(`#list .item[data-k="${key}"]`)) return;
  const m = listRows.find(r => r.key === key);
  if (!m) return;
  const [top, bin] = groupOf(m), leaf = $(`#list details[data-g="${CSS.escape(`${top}|${bin}`)}"]`);
  if (!leaf) return;
  leaf.open = true; if (leaf.parentElement.matches("details")) leaf.parentElement.open = true;
  fillGroup(leaf);

/* Find a pasted sequence on the map: exact match, both strands, across the origin of a
   circular map; the hit is selected (on its strand) like a drag selection. Returns 1-based inclusive hits. */
function findHits(seq, query, circular) {
  const q = query.replace(/[^A-Za-z]/g, "").toUpperCase(), L = seq.length;
  if (!q || q.length > L) return {q, hits: []};
  const S = seq.toUpperCase(), hay = circular ? S + S.slice(0, q.length - 1) : S, hits = [];
  for (const [needle, sense] of [[q, "+"], [revComp(q), "-"]]) {
    if (sense === "-" && needle === q) break;  // palindrome: the same places
    for (let i = hay.indexOf(needle); i >= 0 && i < L; i = hay.indexOf(needle, i + 1))
      hits.push({start: i + 1, end: (i + q.length - 1) % L + 1, sense});
  }
  hits.sort((a, b) => a.start - b.start || (a.sense === "+" ? -1 : 1));
  return {q, hits};
}
let findState = null;
function bindFind() {
  const show = i => {
    const h = findState.hits[i]; findState.i = i;
    setSelection(h.start, h.end, "found", h.sense, false);
    zoomRegion(h.start, h.end);
    $("#fmsg").textContent = `${findState.hits.length > 1 ? `${i + 1} of ${findState.hits.length}: ` : ""}${h.start.toLocaleString()}–${h.end.toLocaleString()}${h.sense === "-" ? " (− strand)" : ""}`;
  };
  const go = () => {
    const {q, hits} = findHits(current.seq, $("#fseq").value, current.topology !== "linear");
    findState = {q, hits, i: 0};
    $("#fprev").hidden = $("#fnext").hidden = hits.length < 2;
    // a one-line box drops the line break after a FASTA header, so the name would run into the bases
    if ($("#fseq").value.trim().startsWith(">")) { $("#fmsg").textContent = "paste only the bases, without the >name line"; return; }
    if (!q) { $("#fmsg").textContent = "paste some bases first"; return; }
    if (!hits.length) { $("#fmsg").innerHTML = `<span class="v-bad">not found</span> (${q.length.toLocaleString()} bases, exact match on either strand)`; return; }
    show(0);
  };
  $("#fgo").onclick = go;
  $("#fseq").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); findState && findState.q && findState.hits.length > 1 && $("#fseq").value && findHits("", $("#fseq").value).q === findState.q ? show((findState.i + 1) % findState.hits.length) : go(); } };
  $("#fnext").onclick = () => findState?.hits.length && show((findState.i + 1) % findState.hits.length);
  $("#fprev").onclick = () => findState?.hits.length && show((findState.i - 1 + findState.hits.length) % findState.hits.length);
}

async function loadSites() {
  const box = $("#sitelist");
  if (siteMode === "off" || !current.seq) { sites = []; box.textContent = ""; redrawMap(); return; }

/* A clicked site (on the map, the sequence view or the list): recognition sequence, cut and overhang */
function showSite(enzyme, pos) {
  const st = sites.find(x => x.enzyme === enzyme), box = $("#siteinfo");
  if (!st || !box) return;
  box.innerHTML = `<div class="card" style="margin-top:6px"><b>${esc(st.enzyme)}</b> <span style="font-family:var(--mono)">${esc(st.recognition || "")}</span>
    · cut <span style="font-family:var(--mono)">${esc(st.site)}</span> <span class="note">(^ top strand, _ bottom strand)</span>
    · overhang <b style="font-family:var(--mono)">${esc(st.overhang || "")}</b>
    · ${st.n === 1 ? `cuts once, at ${st.cuts[0].toLocaleString()}` : `cuts ${st.n}×: ${st.cuts.map(c => c === pos ? `<b>${c.toLocaleString()}</b>` : c.toLocaleString()).join(", ")}`}
    <button id="sitex" style="float:right;padding:0 6px">✕</button></div>`;

function siteMarks() {  // flat list of {pos, enzyme, n}
  return sites.flatMap(s => s.cuts.map(c => ({pos: c, enzyme: s.enzyme, n: s.n, ovhg: s.ovhg || 0})));
}

/* ── zoom: linear view of a window of the map ───────────────────────── */
let zoom = null;  // {start, width} in 0-based map coordinates; start may run past L on circular maps

let cDrag = null;  // a drag on the circular map: {a0, sweep, last}
function mapAngle(svg, e) {
  const ctm = svg.getScreenCTM(); if (!ctm) return null;
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  const q = p.matrixTransform(ctm.inverse());
  let a = Math.atan2(q.y - 210, q.x - 210) + Math.PI / 2;
  return a < 0 ? a + 2 * Math.PI : a;
}
function arcPath(a0, a1) {  // clockwise from a0 to a1 (radians, 0 at the top) on the backbone circle
  const R = 150, pt = a => [210 + R * Math.sin(a), 210 - R * Math.cos(a)], [x0, y0] = pt(a0), [x1, y1] = pt(a1);
  return `M${x0},${y0} A${R},${R} 0 ${((a1 - a0 + 4 * Math.PI) % (2 * Math.PI)) > Math.PI ? 1 : 0} 1 ${x1},${y1}`;
}
/* A double-click on a feature (circle, line or rows), or a click on its label, selects exactly its span on its
   strand. */
function pickFeature(i) {
  const f = current.features[i]; if (!f) return;
  const end = f.end < f.start ? f.end : Math.max(f.end, f.start + 1);  // a feature across the origin ends before it starts
  setSelection(f.start + 1, end, f.label, f.strand < 0 ? "-" : "+");
  if (!rowsView) zoomRegion(f.start + 1, end);
}
let lastMapClick = null;  // {fi, t}: two clicks on one feature make a double-click (the map is redrawn between them)
function bindMapClick() {
  const svg = $("#mapsvg");
  if (!svg) return;  // linear maps too
  svg.style.cursor = "crosshair";
  svg.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;  // right-click clears (contextmenu), it never starts a drag
    const mk = e.target.closest("[data-site]");
    if (mk) { showSite(mk.dataset.site, +mk.dataset.pos); return; }
    const lab = e.target.closest(".flabel");
    if (lab) { pickFeature(+lab.dataset.fi); return; }
    const a = mapAngle(svg, e); if (a == null) return;
    cDrag = {a0: a, last: a, sweep: 0, svg, fi: e.target.closest("[data-fi]")?.dataset.fi};
    svg.setPointerCapture(e.pointerId);
    svg.insertAdjacentHTML("beforeend", `<path id="arcsel" fill="none" stroke="${css("--sel")}" stroke-width="14" stroke-opacity=".45" stroke-linecap="butt"/>`);
    e.preventDefault();
  });

  svg.addEventListener("pointerover", e => {
    const g = e.target.closest("[data-fi]");
    svg.querySelectorAll(".hi").forEach(x => x.classList.remove("hi"));
    if (g) svg.querySelectorAll(`[data-fi="${g.dataset.fi}"]`).forEach(x => x.classList.add("hi"));
  });
  svg.addEventListener("pointerleave", () => svg.querySelectorAll(".hi").forEach(x => x.classList.remove("hi")));
  svg.addEventListener("pointermove", e => {
    if (!cDrag) return;
    const a = mapAngle(svg, e); if (a == null) return;

    if (d > Math.PI) d -= 2 * Math.PI; else if (d < -Math.PI) d += 2 * Math.PI;
    cDrag.sweep += d; cDrag.last = a;
    const lo = cDrag.sweep >= 0 ? cDrag.a0 : a, hi = cDrag.sweep >= 0 ? a : cDrag.a0;
    $("#arcsel")?.setAttribute("d", Math.abs(cDrag.sweep) > 0.02 ? arcPath(lo, hi) : "");
  });

    if (!cDrag) return;
    const d = cDrag; cDrag = null; $("#arcsel")?.remove();
    const L = current.length, toPos = a => Math.floor(a / (2 * Math.PI) * L) % L + 1;
    if (Math.abs(d.sweep) < 0.02) {  // a click: show that spot in the sequence view, marked
      const now = Date.now();
      if (d.fi != null && lastMapClick && lastMapClick.fi === d.fi && now - lastMapClick.t < 450) { lastMapClick = null; pickFeature(+d.fi); return; }
      lastMapClick = {fi: d.fi, t: now};
      const p = toPos(d.a0);
      overlay = [...overlay.filter(o => !o.cursor), {kind: "tick", pos: p, color: "--sel", cursor: true}];
      zoomTo(p - 1, zoom ? zoom.width : Math.min(1000, L));
      const old = $("#mapsvg"); old.outerHTML = mapSvg(current); bindMapClick();
      return;
    }
    const lo = d.sweep >= 0 ? d.a0 : d.last, hi = d.sweep >= 0 ? d.last : d.a0;
    let [a, b] = [toPos(lo), toPos(hi)];
    if (current.topology === "linear" && a > b) [a, b] = [b, a];  // a linear map has no way round the origin

/* The one selection, from the circle, the sequence view or a clicked feature: highlighted on both,
   used by Design ("use map selection"), Assemble and BLAST. */
function setSelection(start, end, label = "selection", sense = "+", strandOnly = false) {
  selRegion = {start, end, sense, label, strandOnly};
  overlay = [...overlay.filter(o => o.kind !== "region"), {kind: "region", start, end, sense, strandOnly}];
  trView = null;
  redrawMap();
  if ($("#trres")) $("#trres").innerHTML = "";
  showSelection();
  if ($("#dstart")) useSelection();
  // Edit features: the selection fills Add feature and Edit bases as it is made, without redrawing the pane
  if ($("#sstart")) { $("#sstart").value = start; $("#send").value = end; }
  if ($("#astart")) { $("#astart").value = start; $("#aend").value = end; $("#astrand").value = sense === "-" ? "-1" : "1"; }
  if ($("#cpseq")) paneSequence();  // the Sequence tab offers "Copy selection"

}
function showSelection() {
  const el = $("#zsel"); if (!el) return;
  const r = selRegion, L = current?.length || 0;
  $("#selclear") && ($("#selclear").disabled = !r);
  if (!r) { el.textContent = "nothing selected"; $("[data-blast=sel]") && ($("[data-blast=sel]").disabled = true); $("#selann") && ($("#selann").disabled = true); $("#seltr") && ($("#seltr").disabled = true); return; }
  const n = r.end >= r.start ? r.end - r.start + 1 : r.end + L - r.start + 1;
  el.innerHTML = `selected <b>${r.start.toLocaleString()}–${r.end.toLocaleString()}</b> (${n.toLocaleString()} bp${r.strandOnly ? `, <b>${r.sense === "-" ? "− (bottom)" : "+ (top)"} strand</b>` : ""}${r.label && r.label !== "selection" ? `, ${esc(r.label)}` : ""})`;
  $("[data-blast=sel]").disabled = false;

function zoomTo(center, width) {
  const L = current.length;
  width = Math.max(40, Math.min(Math.round(width), L));
  let start = Math.round(center - width / 2);
  if (current.topology === "linear") start = Math.max(0, Math.min(start, L - width));
  else start = ((start % L) + L) % L;
  zoom = {start, width};

  $("#zoom").hidden = false;

function zoomRegion(s1, e1) {  // 1-based inclusive, may wrap
  const L = current.length, len = e1 >= s1 ? e1 - s1 + 1 : e1 + L - s1 + 1;
  zoomTo(s1 - 1 + len / 2, Math.max(len * 1.3, 60));
}

/* Primers that overlap go on separate lanes; sets o.lane, returns the count */
function primerLanes(prim, L) {
  const lanes = [];
  for (const o of prim) {
    const a = o.start, b = o.end >= o.start ? o.end : o.end + L;
    let k = 0;
    while ((lanes[k] || []).some(([p, q]) => [0, L, -L].some(d => a <= q + d && p + d <= b))) k++;
    (lanes[k] ||= []).push([a, b]);
    o.lane = k;

}

function linearSvg(start, width, id = "zsvg") {  // the map from `start` (0-based) for `width` bases
  const m = current, L = m.length, W = 900;
  const x = p => ((p - start) / width) * W;
  const inWin = (s, e) => {  // intervals [s, e) of the feature (unwrapped), clipped to the window
    const out = [];
    for (const d of [-L, 0, L]) { const a = Math.max(s + d, start), b = Math.min(e + d, start + width); if (b > a) out.push([a, b]); }
    return out;
  };

  const items = [];
  for (const f of shown(m)) {
    const e = f.end >= f.start ? f.end : f.end + L;
    for (const [a, b] of inWin(f.start, Math.max(e, f.start + 1))) {
      let t = 0;

  const step = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000].find(v => width / v <= 10) || 10000;
  s += `<line x1="0" y1="${rulerY}" x2="${W}" y2="${rulerY}" stroke="${css("--muted")}"/>`;
  const ticks = [];
  for (const d of [-L, 0, L]) for (let q = Math.max(0, Math.ceil((start - d) / step) * step); q < L && q + d <= start + width; q += step) if (q + d >= start) ticks.push([q + d, q || 1]);
  for (const [p, lbl] of ticks) {
    s += `<line x1="${x(p)}" y1="${rulerY - 4}" x2="${x(p)}" y2="${rulerY + 4}" stroke="${css("--muted")}"/>`;
    s += `<text x="${x(p)}" y="${rulerY - 7}" font-size="10" text-anchor="middle" fill="${css("--muted")}">${lbl.toLocaleString()}</text>`;
  }

    if (o.kind !== "region") continue;
    const e = o.end >= o.start ? o.end : o.end + L;

    for (const [a, b] of inWin(o.start - 1, e)) s += `<rect x="${x(a)}" y="${ry}" width="${Math.max(x(b) - x(a), 1)}" height="${rh}" fill="${css("--sel")}" opacity="${o.strandOnly && showSeq ? .45 : .28}"/>`;
  }
  if (showSeq) {
    const comp = {A: "T", C: "G", G: "C", T: "A"};
    for (let p = start; p < start + width; p++) {
      const ch = m.seq[((p % L) + L) % L] || "";
      const cx = x(p + 0.5), pos1 = ((p % L) + L) % L + 1;
      const onP = sd => prim.some(o => o.strand === sd && (o.end >= o.start ? pos1 >= o.start && pos1 <= o.end : pos1 >= o.start || pos1 <= o.end));
      const pc = css("--f-primer");
      s += `<text x="${cx}" y="${seqY}" font-size="11" font-family="var(--mono)" text-anchor="middle" fill="${onP("+") ? pc : css("--ink")}"${onP("+") ? ' font-weight="700"' : ""}>${ch}</text>`;
      s += `<text x="${cx}" y="${seqY + 14}" font-size="11" font-family="var(--mono)" text-anchor="middle" fill="${onP("-") ? pc : css("--muted")}"${onP("-") ? ' font-weight="700"' : ""}>${comp[ch] || "N"}</text>`;
    }
  }

    const t = trView;

      for (const d of [-L, 0, L]) {
        const q = ((c - 1) % L + L) % L + d;
        if (q >= start && q < start + width)
          s += `<text x="${x(q + 0.5)}" y="${seqY + 30}" font-size="11" font-family="var(--mono)" font-weight="700" text-anchor="middle" fill="${css(aa === "*" ? "--bad" : "--accent")}"><title>codon ${k + 1}${t.strand === "-" ? " (− strand)" : ""}</title>${aa}</text>`;
      }
    }
  }

    for (const d of [-L, 0, L]) { const p = o.pos - 1 + d; if (p >= start && p < start + width)
      s += `<line x1="${x(p + 0.5)}" y1="${rulerY}" x2="${x(p + 0.5)}" y2="${H}" stroke="${css(o.color || "--bad")}" stroke-width="2"/>`; }
  }
  for (const o of prim) {  // primer as an arrow 5'→3' on its own lane, under the sequence
    const e = o.end >= o.start ? o.end : o.end + L, y = featY - pLane + 2 + o.lane * 14, h = 12, col = css("--f-primer");
    for (const [a, b] of inWin(o.start - 1, e)) {

      const d = o.strand === "-" ? `M${x1 + hd},${y} L${x2},${y} L${x2},${y + h} L${x1 + hd},${y + h} L${x1},${y + h / 2} Z`

      const lbl = `${o.strand === "-" ? "← " : ""}${o.label || "primer"}${o.strand === "-" ? "" : " →"}`;
      s += `<text x="${(x1 + x2) / 2}" y="${y + h / 2 + 1}" font-size="10" fill="#fff" text-anchor="middle" dominant-baseline="middle" pointer-events="none">${esc(lbl.slice(0, Math.max(4, Math.floor((x2 - x1) / 6))))}</text>`;
      if (showSeq) s += `<text x="${o.strand === "-" ? x1 - 3 : x2 + 3}" y="${y + h / 2 + 1}" font-size="9" fill="${col}" text-anchor="${o.strand === "-" ? "end" : "start"}" dominant-baseline="middle">${o.strand === "-" ? "3′ ◂ binds bottom strand" : "▸ 3′ binds top strand"}</text>`;

    const a = Math.max(p0 + d, start), b = Math.min(p0 + d + st.size, start + width);

  }
  for (const mk of siteMarks()) for (const d of [-L, 0, L]) {
    const p = mk.pos - 1 + d;
    if (p < start || p > start + width) continue;

        + `<path d="M${xt},${seqY - 12} V${seqY + 3} H${xb} V${seqY + 18}" fill="none" stroke="${c}" stroke-width="2"/>`
        + `<path d="M${xt},${seqY - 12} V${seqY + 3} H${xb} V${seqY + 18}" fill="none" stroke="transparent" stroke-width="8"/>`
        + `<text x="${Math.max(xt, xb) + 2}" y="${seqY + (trRow ? 42 : 26)}" font-size="9" fill="${c}">${esc(mk.enzyme)}</text></g>`;  // under the letters, not on them
      continue;
    }
    s += `<g data-site="${esc(mk.enzyme)}" data-pos="${mk.pos}" style="cursor:pointer"><line x1="${x(p)}" y1="${rulerY + 2}" x2="${x(p)}" y2="${H}" stroke="${css("--warn")}" stroke-dasharray="3 2"/>`;
    s += `<line x1="${x(p)}" y1="${rulerY + 2}" x2="${x(p)}" y2="${H}" stroke="transparent" stroke-width="8"/>`;
    s += `<text x="${x(p) + 2}" y="${rulerY + 14}" font-size="9" fill="${css("--warn")}">${esc(mk.enzyme)}</text></g>`;
  }
  for (const {f, a, b, t} of items) {
    const y = featY + t * (th + 4), x1 = x(a), x2 = x(b), col = css(FCOL(f.type)), head = Math.min(8, (x2 - x1) / 2);
    let d;
    if (f.strand > 0) d = `M${x1},${y} L${x2 - head},${y} L${x2},${y + th / 2} L${x2 - head},${y + th} L${x1},${y + th} Z`;
    else if (f.strand < 0) d = `M${x1 + head},${y} L${x2},${y} L${x2},${y + th} L${x1 + head},${y + th} L${x1},${y + th / 2} Z`;
    else d = `M${x1},${y} H${x2} V${y + th} H${x1} Z`;
    s += `<path data-fi="${m.features.indexOf(f)}" d="${d}" fill="${col}" opacity=".85"><title>${esc(f.label)} (${esc(f.type)}) ${f.start + 1}..${f.end}: double-click to select it</title></path>`;
    if (x2 - x1 > 30) s += `<text x="${(x1 + x2) / 2}" y="${y + th / 2 + 1}" font-size="10" fill="#fff" text-anchor="middle" dominant-baseline="middle" pointer-events="none">${esc(f.label.slice(0, Math.floor((x2 - x1) / 6)))}</text>`;
  }

const ROW = 90;  // ▤ rows: bases per row
let rowsKey = null;  // the stretch the rows show; the scroll position is kept while it stays the same
function drawZoom() {
  const L = current.length, fmt = n => n.toLocaleString();
  let {start, width} = zoom;
  if (!rowsView) {
    rowsKey = null;
    $("#zbody").innerHTML = linearSvg(start, width);
    $("#zlabel").textContent = `${fmt(start % L + 1)}–${fmt((start + width - 1) % L + 1)} (${fmt(width)} bp)`;
    bindZoomGestures();
    return;
  }
  // rows: always the whole plasmid, the selection highlighted; drawn as they scroll into view.
  // A redraw (a selection, a primer, a cleared selection) repaints the rows in place and keeps the row at the
  // top where it was: rebuilding them with estimated heights and restoring scrollTop landed somewhere else
  //.
  const sel = !!selRegion, mapKey = `${current.key}:${L}`;

  const focus = rowsFocus, centre = centerRowsOnSel || (sel && rowsKey !== key && !keepRowsScroll);
  rowsFocus = null; centerRowsOnSel = false; keepRowsScroll = false;
  $("#zlabel").innerHTML = `rows: whole plasmid, ${fmt(L)} bp${sel ? `, selection ${fmt(selRegion.start)}–${fmt(selRegion.end)} highlighted` : ""}`;
  let box = old && old.isConnected && old.dataset.map === mapKey ? old : null;

    const dy = anchor ? anchor.getBoundingClientRect().top - top : 0;

  } else {
    let html = "";
    for (let i = 0; i < Math.ceil(L / ROW); i++) html += `<div class="zrow" data-r="${i}" style="min-height:${rowH}px"></div>`;
    $("#zbody").innerHTML = `<div id="zrows" data-map="${mapKey}" style="max-height:70vh;overflow:auto">${html}</div>`;
    box = $("#zrows");
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { fillRow(e.target); io.unobserve(e.target); } }),
      {root: box, rootMargin: "600px 0px"});
    box.querySelectorAll(".zrow").forEach(el => io.observe(el));

    .sort((a, b) => b.len - a.len);

      return [0, L, -L].some(d => s1 < e2 + d && s2 + d < e1); };

  const step = [100, 250, 500, 1000, 2000, 5000, 10000, 20000].find(x => L / x <= 12) || 50000;

    s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${css("--muted")}"/>`;
    s += `<text x="${tx}" y="${ty}" font-size="9" fill="${css("--muted")}" text-anchor="middle" dominant-baseline="middle">${p ? (p >= 1000 ? (p / 1000) + "k" : p) : "1"}</text>`;

      out += `<path d="M${b1x.toFixed(1)},${b1y.toFixed(1)} L${tx.toFixed(1)},${ty.toFixed(1)} L${b2x.toFixed(1)},${b2y.toFixed(1)} Z" fill="${col}" opacity=".9"/>`;

  });

  const sub = m.draft ? (m.plasmid_id && m.plasmid_id !== title ? `from ${m.plasmid_id}` : "") : m.plasmid_id && m.name && m.name !== m.plasmid_id ? m.name : "";
  s += `<text x="${cx}" y="${cy - (sub ? 14 : 6)}" text-anchor="middle" font-size="15" font-weight="600" fill="${css("--ink")}"><title>${esc(title)}</title>${esc(cut(title, 26))}</text>`;
  if (sub) s += `<text x="${cx}" y="${cy + 3}" text-anchor="middle" font-size="12" fill="${css("--ink")}"><title>${esc(sub)}</title>${esc(cut(sub, 32))}</text>`;
  s += `<text x="${cx}" y="${cy + (sub ? 20 : 13)}" text-anchor="middle" font-size="12" fill="${css("--muted")}">${L.toLocaleString()} bp${circular ? "" : " · linear"}</text>`;
  return s + `</svg>`;
}

/* ── upload a new map ──────────────────────────────────────────────── */
async function showUpload() {
  current = null; history.replaceState(null, "", "#upload");
  document.querySelectorAll(".item.sel").forEach(el => el.classList.remove("sel"));
  $("#detail").innerHTML = `<h2 style="font-family:inherit">New map</h2>
    <p class="note">The map is in the bank straight away and is copied to the lab share by the hourly sync (add only, nothing on the share is ever overwritten).
      Use the <b>PMC or EC number your lab assigned</b>. No number yet (an intermediate, a test)? Leave it empty or type your own tag
      (<code>TMP-3</code>, a project code): the file then goes to <b>My workspace</b>, in the folder you choose. You can open and edit it there, and it is copied
      to the share under <i>Workspaces/</i>, not into the bank. Give it its lab ID later on the dashboard (an in-silico clone that got cloned). To change a map that is already in the bank, open it and use Features → Edit features → Save as new version.</p>
    <div class="drop" id="updrop">Drop GenBank (.gb, .gbk) or FASTA files here (one or several), or <input type="file" id="upfile" multiple accept=".gb,.gbk,.genbank,.fa,.fasta,.fas,.txt"></div>
    <div id="upmulti" hidden></div>
    <div id="updet"><p class="note" style="margin:0 0 6px">…or paste a sequence instead (plain bases, FASTA, or a whole GenBank file)</p>
      <textarea id="uptext" rows="5" style="width:100%;font-family:var(--mono);font-size:12px" placeholder="ACGT… or >name / LOCUS …"></textarea>
      <div class="controls"><label>topology <select id="uptopo"><option value="circular">circular</option><option value="linear">linear</option></select></label>
        <button id="upmake">Make a map from this</button><span class="note" id="uppre"></span></div></div>
    <div class="controls">
      <label>PMC / EC number <input type="text" id="upid" placeholder="PMC-07383, EC58489 or empty" style="width:190px"></label>
      <label>Construct name <input type="text" id="upname" placeholder="e.g. pL1-NFR1-6xHis" style="width:320px"></label>
      <label id="upfolderl" hidden>Folder in My workspace <input type="text" id="upfolder" placeholder="e.g. RinRK1/constructs" style="width:200px"></label>
      <button class="primary" id="upgo" disabled>Upload</button></div>
    <div class="note" id="upfn"></div><div id="upres"></div>
    <h3 style="margin-top:22px">Uploads <label class="note" style="font-weight:400"><input type="checkbox" id="upall"> everyone's</label></h3>
    <div id="uplist" class="note">loading…</div>`;
  let file = null;
  const ids = t => (t.match(/PMC[-_ ]?0*\d{1,5}(?!\d)|(?<![A-Za-z])EC[-_ ]?\d{5}(?!\d)/i) || [""])[0];
  const preview = () => { const id = $("#upid").value.trim(), nm = $("#upname").value.trim().replace(/[^\w.+()\-]+/g, "_").replace(/^[._]+|[._]+$/g, "");
    $("#upgo").disabled = !file;
    const fm = /^(PMC|EC)[-_ ]?\d/i.test(id);  // a lab ID, or a typo of one: the server decides
    $("#upgo").textContent = !file || fm ? "Upload" : "Save to My workspace";
    $("#upfolderl").hidden = fm;
    $("#upfn").textContent = file && !fm ? `"${[id, $("#upname").value.trim()].filter(Boolean).join(" ") || file.name}" goes to My workspace: not in the bank; a copy goes to the share under Workspaces/`
      : file && id ? `will be saved as ${id.toUpperCase().replace(/^PMC[-_ ]?0*(\d+)$/, (a, n) => "PMC-" + n.padStart(5, "0")).replace(/^EC[-_ ]?/, "EC")}_${nm}… (the server checks the number)` : ""; };
  // number and name guessed from the file name and the LOCUS line (one file, or each of several)
  const guess = async f => {
    const head = (await f.slice(0, 4000).text()), locus = (head.match(/^LOCUS\s+(\S+)/m) || [])[1] || "";
    const strip = t => t.replace(/PMC[-_ ]?0*\d{1,5}|EC[-_ ]?\d{5}/ig, "").replace(/^[\s_.-]+|[\s_.-]+$/g, "");
    const cands = [strip(f.name.replace(/\.[^.]+$/, "")), /^exported$/i.test(locus) ? "" : strip(locus)];  // LOCUS names are often cut at 16 characters
    return {id: ids(f.name) || ids(locus), name: cands.sort((x, y) => y.length - x.length)[0]};
  };
  const pick = async f => {
    file = f; $("#updrop").firstChild.textContent = f.name + " — ";
    const g = await guess(f);
    if (!$("#upid").value) $("#upid").value = g.id;
    if (!$("#upname").value) $("#upname").value = g.name;
    preview();
  };
  // several files at once: a table to check, then one upload per file through /api/upload
  const single = $("#upgo").closest(".controls");
  const pickMany = async fl => {
    const rows = await Promise.all([...fl].slice(0, 50).map(async f => ({f, ...(await guess(f))})));
    file = null; single.hidden = true; $("#upfn").textContent = "";
    $("#updrop").firstChild.textContent = `${rows.length} files — `;
    const isFm = id => /^(PMC|EC)[-_ ]?\d/i.test(id.trim());
    const draw = () => {
      const anyWs = rows.some(r => !isFm(r.id));
      $("#upmulti").hidden = false;
      $("#upmulti").innerHTML = `<p class="note">${fl.length > 50 ? "Only the first 50 files are taken. " : ""}Check each number and name. A PMC/EC number puts the map in the bank (copied to the share within the hour); no number puts it in My workspace.</p>
        <table><thead><tr><th>File</th><th>PMC / EC number</th><th>Construct name</th><th>Goes to</th><th></th></tr></thead><tbody>${rows.map((r, i) => `<tr data-r="${i}">
          <td title="${esc(r.f.name)}">${esc(r.f.name)}</td><td><input type="text" data-c="id" value="${esc(r.id)}" placeholder="empty = My workspace" style="width:150px"></td>
          <td><input type="text" data-c="name" value="${esc(r.name)}" style="width:100%"></td><td class="note">${isFm(r.id) ? "the bank" : "My workspace"}</td>
          <td data-st>${r.done ? `<span class="v-good">✓</span>` : r.err ? `<span class="v-bad" title="${esc(r.err)}">✗ ${esc(r.err)}</span>` : `<button data-x="${i}" title="leave this file out">✕</button>`}</td></tr>`).join("")}</tbody></table>
        <div class="controls" style="margin-top:8px">${anyWs ? `<label>Folder in My workspace <input type="text" id="upmfolder" value="${esc(rows.folder || "")}" placeholder="e.g. RinRK1/constructs" style="width:220px"></label>` : ""}
          <button class="primary" id="upmgo"${rows.every(r => r.done) ? " disabled" : ""}>Upload ${rows.filter(r => !r.done).length} file(s)</button>
          <button id="upmcancel">Start over</button><span id="upmsg" class="note"></span></div>`;
      $("#upmulti").querySelectorAll("tr[data-r] input").forEach(inp => inp.onchange = () => { rows[+inp.closest("tr").dataset.r][inp.dataset.c] = inp.value.trim(); draw(); });
      $("#upmulti").querySelectorAll("[data-x]").forEach(b => b.onclick = () => { rows.splice(+b.dataset.x, 1); rows.length ? draw() : $("#upmcancel").click(); });
      $("#upmfolder") && ($("#upmfolder").oninput = e => rows.folder = e.target.value);
      $("#upmcancel").onclick = () => { $("#upmulti").hidden = true; $("#upmulti").innerHTML = ""; single.hidden = false; $("#updrop").firstChild.textContent = "Drop GenBank (.gb, .gbk) or FASTA files here (one or several), or "; $("#upfile").value = ""; };
      $("#upmgo").onclick = async () => {
        $("#upmgo").disabled = true;
        let ok = 0, bad = 0;
        const todo = rows.filter(r => !r.done).length;
        for (const r of rows) {
          if (r.done) continue;
          const fd = new FormData();
          fd.append("file", r.f); fd.append("plasmid_id", r.id); fd.append("construct_name", r.name); fd.append("folder", rows.folder || "");
          try { await api("/api/upload", {method: "POST", body: fd}); r.done = true; r.err = ""; ok++; }
          catch (e) { r.err = e.message; bad++; }
          $("#upmsg").textContent = `${ok + bad} of ${todo}…`;
        }
        draw();
        $("#upmsg").innerHTML = `<span class="v-good">${ok} saved</span>${bad ? ` · <span class="v-bad">${bad} refused: fix the number and press Upload again</span>` : ""}`;
        loadList($("#q").value); loadUploads(); loadProjectFolders();
      };
    };
    draw();
  };
  const take = fl => fl.length > 1 ? pickMany(fl) : fl[0] && pick(fl[0]);
  $("#upfile").onchange = e => take(e.target.files);
  $("#upmake").onclick = async () => {
    const text = $("#uptext").value.trim();
    if (!text) return;
    $("#uppre").textContent = "reading…";
    try {
      const r = await api("/api/build/from_sequence", {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({text, name: $("#upname").value, circular: $("#uptopo").value === "circular"})});
      // the pasted sequence becomes the file to upload, so one path handles both
      file = new File([r.genbank], `${asciiName(r.name)}.gb`, {type: "text/plain"});
      $("#updrop").firstChild.textContent = file.name + " — ";
      if (!$("#upname").value && r.name) $("#upname").value = r.name;
      $("#uppre").innerHTML = `<span class="v-good">${r.length.toLocaleString()} bp, ${r.circular ? "circular" : "linear"}, ${r.features} feature(s)</span> — give it a number and upload`;
      preview();
    } catch (e) { $("#uppre").innerHTML = `<span class="v-bad">${esc(e.message)}</span>`; }
  };
  const d = $("#updrop");
  d.ondragover = e => { e.preventDefault(); d.classList.add("over"); };
  d.ondragleave = () => d.classList.remove("over");
  d.ondrop = e => { e.preventDefault(); d.classList.remove("over"); take(e.dataTransfer.files); };
  $("#upid").oninput = $("#upname").oninput = preview;
  $("#upall").onchange = loadUploads;
  $("#upgo").onclick = async () => {
    const fd = new FormData(); fd.append("file", file); fd.append("plasmid_id", $("#upid").value); fd.append("construct_name", $("#upname").value); fd.append("folder", $("#upfolder").value);
    $("#upgo").disabled = true; $("#upres").innerHTML = "";
    try {
      const r = await api("/api/upload", {method: "POST", body: fd});
      if (r.draft) {
        $("#upres").innerHTML = `<p class="v-good">Saved <b>${esc(r.file)}</b> in My workspace — not in the bank. <a href="#" id="upopen">Open it</a> · <a href="/#project/${r.project}/${r.item}">My workspace on the dashboard</a>.</p>`;
        $("#upopen").onclick = e => { e.preventDefault(); tab = "features"; loadProjectFolders(); openMap(r.key); };
        $("#upgo").disabled = false; return;
      }
      $("#upres").innerHTML = `<p class="v-good">Saved as <b>${esc(r.file)}</b>. <a href="#" id="upopen">Open it</a>.</p>` +
        (r.same_sequence_as.length ? `<p class="v-warn">Same sequence as ${esc(r.same_sequence_as.join(", "))}: is this a duplicate?</p>` : "");
      $("#upopen").onclick = e => { e.preventDefault(); tab = "features"; openMap(r.key); };
      loadList($("#q").value); loadUploads();
    } catch (e) { $("#upres").innerHTML = `<p class="v-bad">${esc(e.message)}</p>`; }
    $("#upgo").disabled = false;
  };
  loadUploads();
}

async function loadUploads() {
  const box = $("#uplist"); if (!box) return;
  try {
    const rows = await api("/api/uploads" + ($("#upall").checked ? "?all=true" : ""));
    const st = {queued: "b-info", synced: "b-good", refused: "b-bad", error: "b-bad"};
    box.innerHTML = rows.length ? `<table><thead><tr><th>ID</th><th>File</th><th>By</th><th>Uploaded</th><th>Status</th><th>On the share / problem</th><th></th></tr></thead><tbody>${rows.map(r =>
      `<tr><td>${esc(r.plasmid_id)}</td><td>${esc(r.file)}</td><td>${esc(r.user)}</td><td>${esc(r.uploaded.replace("T", " "))}</td>
        <td><span class="badge ${st[r.status] || "b-warn"}">${esc(r.status === "queued" ? "waiting for sync" : r.status)}</span></td>
        <td>${esc(r.error || (r.dest ? r.dest.split("/").slice(-2).join("/") : ""))}</td>
        <td>${r.status !== "synced" && r.mine ? `<button data-updel="${esc(r.plasmid_id)}" title="remove it before the sync copies it to the share">delete</button>` : ""}</td></tr>`).join("")}</tbody></table>`
      + `<p class="note">Only your own uploads can be deleted, and only before the sync has copied them. A map already on the share stays there.</p>` : "No uploads yet.";
    box.querySelectorAll("[data-updel]").forEach(b => b.onclick = async () => {
      const pid = b.dataset.updel;
      if (!confirm(`Delete the queued upload ${pid}? It is removed from the bank and never reaches the share.`)) return;
      try { await api(`/api/uploads/${encodeURIComponent(pid)}`, {method: "DELETE"}); loadUploads(); loadList($("#q").value); }
      catch (e) { alert(e.message); }
    });
  } catch (e) { box.textContent = e.message; }
}

/* ── panes ─────────────────────────────────────────────────────────── */
let editMode = false, edits = null, orfs = null, orfMin = 100;
const FEATURE_TYPES = ["CDS", "gene", "promoter", "terminator", "rep_origin", "primer_bind", "misc_feature", "protein_bind", "RBS", "polyA_signal", "LTR", "exon", "intron", "variation"];

function paneFeatures() {
  const f = current.features, L = current.length;
  const canEdit = current.format === "genbank";
  if (editMode && !edits) edits = {features: {}, add: [], seq: [], name: current.name, topology: current.topology || "circular"};
  const types = FEATURE_TYPES;
  // any type, typed or picked; the list offers the standard ones and those already in this map
  const typeSel = (v, attr) => `<input type="text" list="ftypelist" ${attr} value="${esc(v)}" style="width:130px" pattern="[A-Za-z][A-Za-z0-9_'\-]{0,19}" title="a feature type: a standard one from the list, or your own (letters, digits, _ - ', up to 20)">`;
  const typeList = `<datalist id="ftypelist">${[...new Set([...types, ...f.map(x => x.type)])].filter(t => t !== "source").map(t => `<option value="${esc(t)}">`).join("")}</datalist>`;
  const rows = f.map((x, i) => {
    const e = (edits && edits.features[i]) || {};
    if (editMode) return `<tr data-i="${i}"${e.action === "delete" ? ' style="opacity:.4;text-decoration:line-through"' : ""}>
      <td><input type="text" data-f="label" value="${esc(e.label ?? x.label)}" style="width:100%"></td><td>${typeSel(e.type ?? x.type, 'data-f="type"')}</td>
      <td class="num">${x.start + 1}</td><td class="num">${x.end}</td><td>${x.strand < 0 ? "−" : x.strand > 0 ? "+" : ""}</td>
      <td><button data-del="${i}">${e.action === "delete" ? "undo" : "delete"}</button></td></tr>`;
    return `<tr class="click${hiddenFeats.has(i) ? " off" : ""}" data-i="${i}"><td class="vis"><input type="checkbox" data-vis="${i}" title="show on map"${hiddenFeats.has(i) ? "" : " checked"}></td><td><span class="swatch" style="background:var(${FCOL(x.type)})"></span>${esc(x.label)}</td><td>${esc(x.type)}</td><td class="num">${x.start + 1}</td><td class="num">${x.end}</td><td>${x.strand < 0 ? "−" : x.strand > 0 ? "+" : ""}</td><td class="num">${flen(x, L).toLocaleString()}${x.wraps ? " ↻" : ""}</td></tr>`;
  }).join("");
  $("#pane").innerHTML = `
    <div class="controls">
      ${canEdit ? `<button id="fedit">${editMode ? "Cancel editing" : "Edit features"}</button>` : `<span class="note">Editing needs a GenBank file.</span>`}
      ${current.seq ? `<button id="fauto" title="find the parts of the common list and your own list in this map">Auto-annotate</button>` : ""}
      ${current.seq && f.length ? `<button id="fjoin" class="adv" title="join exons (or any features on one strand) into one coding sequence and check its reading frame">Join exons → CDS…</button>` : ""}
      <label class="adv"><input type="checkbox" id="forf"${orfs ? " checked" : ""}> ORFs ≥ <input type="number" id="forfmin" value="${orfMin}" min="30" step="10" style="width:64px"> aa</label>
    </div>
    <div id="joinbox"></div>
    ${editMode ? `${typeList}<div class="controls"><label>name <input type="text" id="ename" value="${esc(edits.name)}"></label>
      <label>topology <select id="etopo"><option${edits.topology === "circular" ? " selected" : ""}>circular</option><option${edits.topology === "linear" ? " selected" : ""}>linear</option></select></label>
      <label title="flip the whole map, features included, after the other edits"><input type="checkbox" id="erc"${edits.reverse_complement ? " checked" : ""}> reverse complement the map</label></div>` : ""}
    ${f.length && !editMode ? `<div class="ftypes"><span class="note">show:</span>${[...new Set(f.map(x => x.type))].map(t => {
      const idx = f.map((x, i) => x.type === t ? i : -1).filter(i => i >= 0), off = idx.every(i => hiddenFeats.has(i));
      return `<label class="${off ? "off" : ""}"><input type="checkbox" data-vtype="${esc(t)}"${off ? "" : " checked"}> <span class="swatch" style="background:var(${FCOL(t)})"></span>${esc(t)} ${idx.length}</label>`; }).join("")}
      <button id="vall">all</button><button id="vnone">none</button></div>` : ""}
    ${editMode ? `<div class="card" style="margin-top:10px"><b>Add feature</b>
      <div class="controls" style="margin:6px 0 0"><input type="text" id="alabel" placeholder="label">${typeSel("misc_feature", 'id="atype"')}
        <label>start <input type="number" id="astart" min="1" max="${L}" value="${selRegion ? selRegion.start : ""}" style="width:80px"></label>
        <label>end <input type="number" id="aend" min="1" max="${L}" value="${selRegion ? selRegion.end : ""}" style="width:80px"></label>
        <select id="astrand"><option value="1">+</option><option value="-1">−</option><option value="0">none</option></select>
        <button id="aadd">add</button></div>
      ${edits.add.length ? `<p class="note">to add: ${edits.add.map(a => `${esc(a.label)} (${esc(a.type)} ${a.start}..${a.end})`).join(", ")}</p>` : ""}</div>
    <div class="card" style="margin-top:10px"><b>Edit bases</b> <span class="note">replace the bases from start to end (the selection fills them in); end = start − 1 inserts before start; leave “new bases” empty to delete. Features move with the edit.</span>
      <div class="controls" style="margin:6px 0 0">
        <label>start <input type="number" id="sstart" min="1" max="${L + 1}" value="${selRegion ? selRegion.start : ""}" style="width:80px"></label>
        <label>end <input type="number" id="send" min="0" max="${L}" value="${selRegion ? selRegion.end : ""}" style="width:80px"></label>
        <input type="text" id="sbases" placeholder="new bases (ACGT…)" style="width:260px;font-family:var(--mono)">
        <button id="sadd">add</button></div>
      ${edits.seq.length ? `<p class="note">to change: ${edits.seq.map(e => e.end < e.start ? `insert ${e.bases.length} bp before ${e.start}` : e.bases ? `${e.start}..${e.end} → ${e.bases.length} bp` : `delete ${e.start}..${e.end}`).join(", ")} <a href="#" id="sclear">clear</a></p>` : ""}</div>
      ${current.draft ? `<div class="controls"><button class="primary" id="esave" title="saves over this file (your own working copy)">Save</button>
        <span class="note">Saves over this file in ${esc(current.draft.personal ? "My workspace" : "the project")}${current.draft.personal ? "; the copy on the share follows within the hour" : ""}.</span></div>`
      : `<div class="controls"><button id="esave" title="${esc(KEEPS.gb_edit)}">Save as new version</button>
        <span class="note">Saves a new GenBank file to the outbox (~/PlasmidBank/outbox) and downloads it. The original file is never changed.</span></div>`}
      ${canOverwrite(current) ? `<div class="controls"><button id="eow" style="color:var(--bad);border-color:var(--bad)">Overwrite on the share…</button>
        <span class="note">Writes these edits over the map on the lab share, for everyone (after two confirmations). The old file is kept in <i>_replaced/</i> beside it.</span></div>` : ""}
      <div class="controls"><button id="ecopy"${current.draft ? "" : ' class="primary"'}>${current.draft ? "Save as…" : "Save to My workspace…"}</button>
        <span class="note">${current.draft ? "A new file, with the name and folder you choose; this one stays as it was." : "Your own editable copy, with these edits, under the name and in the folder you choose; the bank map is not touched."}</span></div>
      <div id="eres"></div>` : ""}
    ${f.length ? `<table><thead><tr>${editMode ? "" : "<th></th>"}<th>Label</th><th>Type</th><th class="num">Start</th><th class="num">End</th><th>Strand</th><th class="num">${editMode ? "" : "Length"}</th></tr></thead><tbody>${rows}</tbody></table>` : `<p class="note">No annotated features.</p>`}
    <div id="orflist"></div>`;
  $("#fjoin") && ($("#fjoin").onclick = () => showJoin());
  if (canEdit) $("#fedit").onclick = () => { editMode = !editMode; edits = null; paneFeatures(); };
  $("#fauto") && ($("#fauto").onclick = autoAnnotate);
  $("#forf").onchange = e => { if (e.target.checked) loadOrfs(); else { orfs = null; overlay = overlay.filter(o => o.kind !== "orf"); redrawMap(); $("#orflist").innerHTML = ""; } };
  $("#forfmin").onchange = e => { orfMin = +e.target.value || 100; if (orfs) loadOrfs(); };
  if (orfs) showOrfs();
  if (!editMode) {
    const setVis = setFeatVis;
    $("#pane").querySelectorAll("input[data-vis]").forEach(c => { c.onclick = e => e.stopPropagation(); c.onchange = () => setVis([+c.dataset.vis], c.checked); });
    $("#pane").querySelectorAll("input[data-vtype]").forEach(c => c.onchange = () => setVis(f.map((x, i) => x.type === c.dataset.vtype ? i : -1).filter(i => i >= 0), c.checked));
    if (f.length) { $("#vall").onclick = () => setVis(f.map((x, i) => i), true); $("#vnone").onclick = () => setVis(f.map((x, i) => i), false); }
    $("#pane").querySelectorAll("tr.click").forEach(tr => tr.onclick = () => pickFeature(+tr.dataset.i));
    return;
  }
  $("#pane").querySelectorAll("tr[data-i]").forEach(tr => {
    const i = +tr.dataset.i, rec = () => (edits.features[i] = edits.features[i] || {});
    tr.querySelectorAll("[data-f]").forEach(inp => inp.onchange = () => { const r = rec(); r[inp.dataset.f] = inp.value; if (r.action !== "delete") r.action = "update"; });
    tr.querySelector("[data-del]").onclick = () => { const r = rec(); r.action = r.action === "delete" ? (r.label || r.type ? "update" : undefined) : "delete"; paneFeatures(); };
  });
  $("#ename").onchange = e => edits.name = e.target.value;
  $("#etopo").onchange = e => edits.topology = e.target.value;
  $("#erc").onchange = e => edits.reverse_complement = e.target.checked;
  $("#aadd").onclick = () => {
    const a = {label: $("#alabel").value || "new feature", type: $("#atype").value, start: +$("#astart").value, end: +$("#aend").value, strand: +$("#astrand").value};
    if (!a.start || !a.end) return;
    edits.add.push(a); paneFeatures();
  };
  $("#sadd").onclick = () => {
    const e = {start: +$("#sstart").value, end: $("#send").value === "" ? NaN : +$("#send").value, bases: $("#sbases").value.replace(/\s+/g, "").toUpperCase()};
    if (!e.start || isNaN(e.end) || (e.end < e.start && !e.bases)) return;
    edits.seq.push(e); paneFeatures();
  };
  $("#sclear") && ($("#sclear").onclick = ev => { ev.preventDefault(); edits.seq = []; paneFeatures(); });
  const editBody = () => ({name: edits.name !== current.name ? edits.name : "", topology: edits.topology, add: edits.add, seq: edits.seq,
      reverse_complement: !!edits.reverse_complement,
      features: Object.entries(edits.features).filter(([, v]) => v.action).map(([k, v]) => ({index: +k, ...v}))});
  $("#eow") && ($("#eow").onclick = () => overwriteOnO({edits: JSON.stringify(editBody())}, $("#eres")));
  $("#ecopy") && ($("#ecopy").onclick = async () => {
    const d = current.draft;
    const a = await askNameFolder(d ? "Save as" : "Save to My workspace", d ? `${d.label || current.name} copy` : (edits.name || current.plasmid_id || current.name), d ? d.folder || "" : "");
    if (!a) return;
    try {
      const r = await api(`/api/maps/${current.key}/copy`, {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({edits: editBody(), folder: a.folder, label: a.label})});
      loadProjectFolders(); openMap(r.key);
    } catch (e) { $("#eres").innerHTML = `<p class="v-bad">${esc(e.message)}</p>`; }
  });
  $("#esave").onclick = async () => {
    const body = editBody();
    if (current.draft) {
      try {
        const r = await saveVersion(body), sel = selRegion;
        await openMap(current.key);
        $("#eres") && ($("#eres").innerHTML = "");
        $("#pane").insertAdjacentHTML("afterbegin", `<p class="v-good">Saved. ${esc(r.summary.join(" · ") || "no changes")}</p>`);
        if (sel && sel.end <= current.length) setSelection(sel.start, sel.end);
      } catch (e) { $("#eres").innerHTML = `<p class="v-bad">${esc(e.message)}</p>`; }
      return;
    }
    try {
      const r = await saveVersion(body);
      download(r.saved_to.split("/").pop(), r.genbank);
      showMe();
      $("#eres").innerHTML = `<p class="v-good">Saved to ${esc(r.saved_to)}</p><p class="note">${esc(r.summary.join(" · ") || "no changes")}</p>`;
    } catch (e) { $("#eres").innerHTML = `<p class="v-bad">${esc(e.message)}</p>`; }
  };
}

/* ── overwrite a bank map on the share: any map, after two confirmations; the old file is kept ── */
const canOverwrite = m => myRole !== "student" && m && m.key >= 0 && !m.draft && !m.uploaded_by && !/^(Workspaces|uploads)\//.test(m.file) && !m.file.startsWith("/");
async function overwriteOnO(content, out) {
  const id = current.plasmid_id || current.file.split("/").pop();
  if (!confirm(`Overwrite ${id} on the lab share?\n\nEveryone will get the new version, in this app and in CLC, SnapGene or Benchling on the share. `
    + `The old file is kept in a _replaced folder next to it, so it can be put back.\n\nThe hourly sync does the writing, and refuses if someone changed the file on the share in the meantime.`)) return;
  const typed = prompt(`To confirm, type the map's ID exactly:\n\n${id}`);
  if (typed === null) return;
  const fd = new FormData();
  fd.append("confirm_id", typed);
  if (content.file) fd.append("file", content.file); else fd.append("edits", content.edits);
  try {
    const r = await api(`/api/maps/${current.key}/overwrite`, {method: "POST", body: fd});
    editMode = false; edits = null;
    await openMap(current.key);
    $("#pane").insertAdjacentHTML("afterbegin", `<p class="v-good">Queued: ${esc(r.rel)} will be replaced by ${esc(r.new_name)} at the next full hour. The bank shows the new version already.</p>`);
  } catch (e) { (out || $("#pane")).insertAdjacentHTML("afterbegin", `<p class="v-bad">${esc(e.message)}</p>`); }
}

/* ── exons joined into one CDS ("CLC connects annotated exons"): frame, translation, add as a join ── */
function showJoin() {
  const f = current.features, box = $("#joinbox");
  if (box.innerHTML) { box.innerHTML = ""; return; }
  // "nothing happened" — the box opened under the whole feature list, out of sight, and only
  // features typed exon were ticked. It now opens above the list, ticks exons (else nothing) and says what to do.
  const pre = new Set(f.map((x, i) => x.type === "exon" ? i : -1).filter(i => i >= 0));
  const unsaved = editMode && edits && (edits.add.length || edits.seq.length || Object.keys(edits.features).length);
  box.innerHTML = `<div class="card" style="margin:10px 0"><b>Join into one coding sequence</b>
    <span class="note">tick the parts to join (exons, or CDS pieces; same strand), then <b>Check the frame</b>; they are joined 5′→3′ on their strand, whatever order you tick them in</span>
    ${unsaved ? `<p class="v-bad" style="margin:4px 0">Features added or changed in the editor are not in this list until you save them.</p>` : ""}
    <div style="max-height:220px;overflow:auto;margin:6px 0">${f.map((x, i) => `<label style="display:block"><input type="checkbox" data-j="${i}"${pre.has(i) ? " checked" : ""}>
      <span class="swatch" style="background:var(${FCOL(x.type)})"></span> ${esc(x.label)} <span class="note">${esc(x.type)} ${x.start + 1}..${x.end} ${x.strand < 0 ? "−" : x.strand > 0 ? "+" : "no strand"}</span></label>`).join("")}</div>
    <div class="controls"><button class="primary" id="jgo">Check the frame</button><span id="jres"></span></div><div id="jout"></div></div>`;
  $("#jgo").onclick = async () => {
    const idx = [...box.querySelectorAll("[data-j]:checked")].map(c => +c.dataset.j);
    if (!idx.length) { $("#jout").innerHTML = `<p class="v-bad">Tick the parts to join first.</p>`; return; }
    let r;
    try { r = await api(`/api/maps/${current.key}/join`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({indices: idx})}); }
    catch (e) { $("#jout").innerHTML = `<p class="v-bad">${esc(e.message)}</p>`; return; }
    const ok = (b, yes, no) => b ? `<span class="v-good">✓ ${yes}</span>` : `<span class="v-bad">✗ ${no}</span>`;
    $("#jout").innerHTML = `<p>${r.length.toLocaleString()} nt on the ${r.strand} strand ·
        ${ok(r.multiple_of_3, "a multiple of 3", `not a multiple of 3 (${r.length % 3} extra)`)} ·
        ${ok(r.starts_with_atg, "starts with ATG", "no ATG at the start")} ·
        ${ok(r.ends_with_stop, "ends with a stop", "no stop at the end")} ·
        ${ok(!r.internal_stops, "no internal stop", `${r.internal_stops} internal stop(s)`)}</p>
      <table><thead><tr><th>Part, 5′→3′</th><th class="num">Start</th><th class="num">End</th><th class="num">nt</th><th class="num">Starts in frame</th></tr></thead><tbody>${
        r.parts.map(x => `<tr><td>${esc(x.label)}</td><td class="num">${x.start}</td><td class="num">${x.end}</td><td class="num">${x.length}</td><td class="num">${x.phase === 0 ? "1 (codon start)" : x.phase === 1 ? "2" : "3"}</td></tr>`).join("")}</tbody></table>
      <div class="seq" style="margin-top:6px;word-break:break-all;white-space:pre-wrap">${esc(r.protein.match(/.{1,60}/g)?.join("\n") || "")}</div>
      <div class="controls"><button id="jcopy">Copy protein</button>
        ${current.format === "genbank" ? `<input type="text" id="jlabel" placeholder="CDS label" value="${esc(((f[idx[0]]?.label || "").replace(/[ _-]?exon.*$/i, "").trim() || current.draft?.label || current.plasmid_id || "gene") + " CDS")}" style="width:200px">
          <button id="jadd" title="adds one CDS made of these parts (Features → edit; save in place in My workspace, or as a copy)">Add as CDS to the map</button>` : ""}</div>`;
    $("#jcopy").onclick = () => navigator.clipboard.writeText(r.protein).catch(() => {});
    $("#jadd") && ($("#jadd").onclick = () => {

/* ── auto-annotation: proposals from the common + my list; saved only as a new version ── */
async function autoAnnotate() {
  const box = document.createElement("div");
  $("#pane").prepend(box);

  let r;
  try { r = await api(`/api/maps/${current.key}/annotate`, {method: "POST"}); }
  catch (e) { box.innerHTML = `<p class="v-bad">${esc(e.message)}</p>`; return; }
  const P = r.proposals;
  if (!P.length) {

      <a href="#annotations" id="fgo">Open the annotation lists</a>.</p></div>`;
    $("#fgo").onclick = e => { e.preventDefault(); showAnnotations(); };

    P.map((p, i) => `<tr><td><input type="checkbox" data-ap="${i}"${p.same_span_annotated ? "" : " checked"}></td><td>${esc(p.label)}</td><td>${esc(p.type)}</td>

      <td class="note">${p.same_span_annotated ? "something is already annotated here" : ""}</td></tr>`).join("")}</tbody></table>
    <div class="controls" style="margin-top:8px">${current.format === "genbank"
      ? `<button class="primary" id="fapsave">Save as new version with the ticked parts</button>` : `<span class="note">Saving needs a GenBank file.</span>`}
      <button id="fapshow">show on the map</button><span id="fapres"></span></div>
    <p class="note">Nothing changes in the bank: the new version goes to your saved files (top right), like any other edit.</p></div>`;
  const picked = () => [...box.querySelectorAll("[data-ap]")].filter(c => c.checked).map(c => P[+c.dataset.ap]);
