function primerName(dir, n) {
  const parts = [$("#dini").value, current.plasmid_id, $("#dtarget").value, ($("#dgg") && $("#dtask").value === "cloning" && $("#dgg").value) ? $("#doh5").value : ""]
    .map(asciiName).filter(Boolean);
  return `${parts.join("_")}_${dir}${n || 1}`;
}

function orderLines(rows) {  // same columns as the lab's oligo export file
  const today = new Date(), date = `${today.getMonth() + 1}/${today.getDate()}/${today.getFullYear()}`;
  const head = "Reference\tOligo_type\tOligo id\tOligo name\tOligo target\tOligo sequence\tComment\tDate";
  return [head, ...rows.map(([name, p, purpose]) => [$("#dini").value, p.full.length > 60 ? "HPLC" : "Desalt", "", name,
    `${current.plasmid_id || ""} ${$("#dtarget").value}`.trim(), p.full,
    `${purpose}; anneal Tm ${p.tm} °C; binds ${p.start}-${p.end} (${p.strand})`, date].join("\t"))].join("\n");
}

function primerRow(p, dir, name, purpose) {
  const warn = [];
  if (p.other_sites.length) warn.push(`<span class="badge b-bad" title="${esc(p.other_sites.map(o => `${o.strand} ${o.start}-${o.end} (${o.mismatches} mm)`).join("; "))}">${p.other_sites.length} other site(s)</span>`);
  if (p.in_collection.length) warn.push(`<span class="badge b-good" title="${esc(p.in_collection.map(c => c.ids.join("/") + " " + c.names.join("/")).join("; "))}">in collection: ${esc(p.in_collection[0].ids[0])}</span>`);
  if (p.hairpin_tm > 47) warn.push(`<span class="badge b-warn">hairpin ${p.hairpin_tm}°</span>`);
  if (p.self_dimer_tm > 45) warn.push(`<span class="badge b-warn">self-dimer ${p.self_dimer_tm}°</span>`);
  if (p.gc_warning) warn.push(`<span class="badge b-warn">GC ${p.gc}%</span>`);
  const seqHtml = `<span style="text-transform:lowercase">${esc(p.tail)}</span>${esc(p.sequence)}`;
  return `<tr><td>${dir}</td><td class="ctx">${seqHtml}</td><td class="num">${p.length}${p.tail ? `+${p.tail.length}` : ""}</td>
    <td class="num">${p.tm ?? ""}${p.tm_full ? ` <span class="note">(${p.tm_full})</span>` : ""}</td><td class="num">${p.gc}</td>
    <td class="num">${p.start}–${p.end}</td><td>${warn.join(" ")}</td>
    <td>${name ? `<button data-pad="${padCands.push({name, p, purpose}) - 1}" title="keep it in your primer scratchpad until it has a PM number">+ scratchpad</button>` : ""}</td></tr>`;
}

/* ── primer scratchpad: kept in this browser until the primers show up in the oligo export ──
   Labels (5′/3′ modifications) come from the order template's code list (oligo_mods.json) and are
   written inline, [6FAM]ACGT…, the way the oligo export already stores them. */
let padCands = [];
const padLoad = () => { try { return JSON.parse(store.get("pb_scratchpad") || "[]"); } catch { return []; } };
const padSave = items => store.set("pb_scratchpad", JSON.stringify(items));
const padSeq = x => `${x.mod5 || ""}${x.full}${x.mod3 || ""}`;  // as ordered, labels inline
const padType = x => x.full.length > 60 ? "HPLC" : "Desalt";
const padOrderOpts = () => { try { return JSON.parse(store.get("pb_order") || "{}"); } catch { return {}; } };

function padAdd(c) {
  const items = padLoad();
  if (items.some(x => x.full === c.p.full && !x.mod5 && !x.mod3)) { padRender("already in the scratchpad"); return; }
  items.push({name: c.name, full: c.p.full, ref: $("#dini")?.value || store.get("pb_initials"),
    target: `${current?.plasmid_id || ""} ${$("#dtarget")?.value || c.target || ""}`.trim(),
    comment: `${c.purpose}; anneal Tm ${c.p.tm} °C; binds ${c.p.start}-${c.p.end} (${c.p.strand})`,
    map: current?.plasmid_id || "", ids: [], mod5: "", mod3: ""});
  padSave(items);
  padRender(`Added ${c.name}. Add more, or export the scratchpad and enter the primers in your oligo database to get their PM numbers.`);
}

async function padRender(msg) {
  const box = $("#pad"); if (!box) return;
  const items = padLoad(), mods = presets.oligo_mods || [], o = presets.order || {}, opt = padOrderOpts();
  const pick = (end, x, i) => `<select data-mod${end}="${i}" style="max-width:150px"><option value="">none</option>${
    mods.filter(m => m.positions.includes(end)).map(m => `<option value="${esc(m.code)}"${(end === "5" ? x.mod5 : x.mod3) === m.code ? " selected" : ""}>${esc(m.name)} ${esc(m.code)}</option>`).join("")}</select>`;
  const sel = (k, list) => `<label>${k} <select data-ord="${k}">${(list || []).map(v => `<option${String(opt[k] ?? list[0]) === String(v) ? " selected" : ""}>${esc(v)}</option>`).join("")}</select></label>`;
  box.innerHTML = `<div class="card"><h3>Primer scratchpad <span class="note">${items.length} primer(s) · kept in this browser only</span></h3>
    ${msg ? `<p class="msgs">${esc(msg)}</p>` : ""}
    ${items.length ? `<table><thead><tr><th>Name</th><th>5′ label</th><th>5′→3′ as ordered</th><th>3′ label</th><th>Map</th><th>PM number</th><th></th></tr></thead><tbody>${items.map((x, i) => `<tr>
      <td>${esc(x.name)}${x.name.length >= 30 ? ` <span class="badge b-warn" title="the order form wants names under 30 characters">long name</span>` : ""}</td>
      <td>${pick("5", x, i)}</td><td class="ctx">${esc(padSeq(x))}</td>
      <td>${pick("3", x, i)}${x.mod3 ? `<div><span class="badge b-warn" title="a polymerase cannot extend from a blocked 3′ end">blocks extension: probe, not a PCR or sequencing primer</span></div>` : ""}</td>
      <td>${esc(x.map)}</td>
      <td>${x.ids.length ? `<span class="badge b-good">${esc(x.ids.join(", "))}</span>` : `<span class="note">waiting for the oligo export</span>`}</td>
      <td><button data-padrm="${i}">remove</button></td></tr>`).join("")}</tbody></table>
    <div class="controls" style="margin-top:8px"><button class="primary" id="padx">Export for the oligo database</button><button id="padchk">Check for PM numbers</button>
      ${items.some(x => x.ids.length) ? `<button id="padclr">Remove the ones with a PM number</button>` : ""}</div>
    <p class="note">The export has the oligo export's columns with Oligo id empty, labels written inline ([6FAM]ACGT…) and Oligo_type HPLC above 60 nt, otherwise Desalt.
      Import it into your oligo database, which assigns the PM numbers. Once an admin uploads the next oligo export, each primer here shows its PM number (bases and labels must both match).</p>
    <div class="controls" style="margin-top:10px"><b>Order form</b> ${sel("Scale", o.scale)} ${sel("Format", o.format)} ${sel("Concentration", o.concentration)} ${sel("Tubes", o.tubes)}
      <button id="pado">Copy rows for the order form</button></div>
    <p class="note">Rows in the tube order template's columns, without the header (as the template asks): name = PM number when known, labels in the 5′/3′ Mod columns,
      purification HPLC above 60 nt, otherwise Desalt. Concentration only applies to a liquid format.</p>
    <textarea id="padotext" readonly rows="3" hidden style="width:100%;font-family:var(--mono);font-size:12px"></textarea>`
    : `<p class="note">Empty. Use "+ scratchpad" next to a designed primer.</p>`}</div>`;
  box.querySelectorAll("[data-padrm]").forEach(b => b.onclick = () => { const it = padLoad(); it.splice(+b.dataset.padrm, 1); padSave(it); padRender(); });
  box.querySelectorAll("[data-mod5],[data-mod3]").forEach(sl => sl.onchange = () => {
    const it = padLoad(), i = +(sl.dataset.mod5 ?? sl.dataset.mod3);
    it[i][sl.dataset.mod5 != null ? "mod5" : "mod3"] = sl.value; it[i].ids = [];  // a labelled oligo is a different oligo
    padSave(it); padRender(); padCheck(false);
  });
  box.querySelectorAll("[data-ord]").forEach(sl => sl.onchange = () => { const v = padOrderOpts(); v[sl.dataset.ord] = sl.value; store.set("pb_order", JSON.stringify(v)); });
  $("#padx")?.addEventListener("click", padExport);
  $("#padchk")?.addEventListener("click", () => padCheck(true));
  $("#padclr")?.addEventListener("click", () => { padSave(padLoad().filter(x => !x.ids.length)); padRender(); });
  $("#pado")?.addEventListener("click", padOrder);
}

function padExport() {
  const today = new Date(), date = `${today.getMonth() + 1}/${today.getDate()}/${today.getFullYear()}`;
  const rows = padLoad().filter(x => !x.ids.length);
  if (!rows.length) { padRender("Nothing to export: every primer here already has a PM number."); return; }
  const text = ["Reference\tOligo_type\tOligo id\tOligo name\tOligo target\tOligo sequence\tComment\tDate",
    ...rows.map(x => [x.ref, padType(x), "", x.name, x.target, padSeq(x), x.comment, date].join("\t"))].join("\r\n") + "\r\n";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type: "text/tab-separated-values"}));
  a.download = `primers_for_oligo_db_${today.toISOString().slice(0, 10)}.tab`;
  a.click(); URL.revokeObjectURL(a.href);
}

function padOrder() {
  const items = padLoad(), o = presets.order || {}, v = padOrderOpts(), get = k => v[k] ?? (o[k.toLowerCase()] || [""])[0];
  const fmt = get("Format"), liquid = /solution/i.test(fmt);
  const lines = items.map(x => [x.ids[0] || x.name, x.mod5 || "", x.full, x.mod3 || "", get("Scale"), padType(x), fmt,
    liquid && get("Concentration") !== "None" ? get("Concentration") : "", get("Tubes"), ""].join("\t"));
  const t = $("#padotext"); t.hidden = false; t.value = lines.join("\n"); t.select();
  navigator.clipboard?.writeText(t.value).catch(() => {});
  const missing = items.filter(x => !x.ids.length).length;
  padNote(`${lines.length} row(s) copied${missing ? `; ${missing} without a PM number use their design name` : ""}.`);
}
const padNote = m => { const n = $("#pad .msgs") || $("#pad h3"); n.insertAdjacentHTML("afterend", `<p class="msgs">${esc(m)}</p>`); };

async function padCheck(say) {
  const items = padLoad(), open = items.filter(x => !x.ids.length);
  if (!open.length) { if (say) padRender("Every primer here has a PM number."); return; }
  try {
    const found = await api("/api/oligos/lookup", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({sequences: open.map(padSeq)})});
    let n = 0;
    open.forEach(x => { if ((found[padSeq(x)] || []).length) { x.ids = found[padSeq(x)]; n++; } });
    padSave(items);
    if (say || n) padRender(`${n} primer(s) found in the oligo collection.`);
  } catch (e) { padRender(e.message); }
}

function productBlock(pr) {
  const sites = pr.internal_sites.length
    ? `<span class="badge b-bad">internal ${esc(pr.internal_sites.map(s => `${s.enzyme}@${s.position}`).join(", "))}</span>`
    : `<span class="badge b-good">no internal BsaI/BpiI/Esp3I/SapI</span>`;
  return `<div class="note" style="margin-top:6px">Product ${pr.product.toLocaleString()} bp · ${sites}
    <div class="ctx" style="margin-top:4px">5′ ${esc(pr.product_head)} … ${esc(pr.product_tail)} 3′</div>
    <details><summary>full product sequence</summary><div class="seq">${esc(pr.product_seq)}</div></details></div>`;
}

function showPairs(r) {
  const head = `${(r.warnings || []).map(w => `<p class="msgs">⚠ ${esc(w)}</p>`).join("")}
    <p class="note">Specificity checked against: ${esc(r.checked_against)}.${r.trimmed && (r.trimmed["5prime"] || r.trimmed["3prime"]) ? ` Fusion site supplies ${r.trimmed["5prime"]} nt at the 5′ end / ${r.trimmed["3prime"]} nt at the 3′ end of the part.` : ""}</p>`;
  if (!r.pairs.length) {
    $("#dresults").innerHTML = head + `<p class="v-bad">primer3 found no pair.</p><p class="note">${esc(Object.values(r.explain || {}).join(" · "))}</p>`;
    redrawMap(); return;
  }
  const purpose = r.task === "cloning" ? ($("#dgg").value ? `${$("#dgg").value} Golden Gate ${$("#doh5").value}-${$("#doh3").value}` : "cloning") : "PCR";
  $("#dresults").innerHTML = head + r.pairs.map((pr, i) => `
    <div class="card"><h3>${r.task === "cloning" ? "Cloning pair" : `Pair ${i + 1}`} <span class="note">ΔTm ${pr.tm_difference}°${pr.penalty != null ? ` · penalty ${pr.penalty}` : ""}${pr.pair_dimer_tm > 45 ? ` · F/R dimer ${pr.pair_dimer_tm}°` : ""}</span>
      <button class="primary" style="float:right;padding:3px 10px" data-show="${i}">show on map</button></h3>
      <table><thead><tr><th></th><th>5′→3′ (tail lowercase)</th><th class="num">nt</th><th class="num">Tm °C</th><th class="num">GC %</th><th class="num">binds</th><th>checks</th><th></th></tr></thead>
      <tbody>${primerRow(pr.forward, "F", primerName("F", i + 1), purpose)}${primerRow(pr.reverse, "R", primerName("R", i + 1), purpose)}</tbody></table>
      ${productBlock(pr)}
      <textarea readonly rows="3" style="width:100%;margin-top:6px;font-family:var(--mono);font-size:12px">${esc(orderLines([[primerName("F", i + 1), pr.forward, purpose], [primerName("R", i + 1), pr.reverse, purpose]]))}</textarea>
    </div>`).join("") + `<p class="note">Order lines use the oligo export's columns; the Oligo id is left empty. Next free number would be ${esc(presets.next_pm || "?")} (highest used ${esc(presets.highest_pm || "?")}) — not reserved.</p>`;
  $("#dresults").querySelectorAll("button[data-show]").forEach(b => b.onclick = () => {
    const pr = r.pairs[+b.dataset.show];
    overlay = [{kind: "region", start: r.region[0], end: r.region[1]},
      {kind: "tick", pos: pr.forward.three_prime, color: "--f-primer"}, {kind: "tick", pos: pr.reverse.three_prime, color: "--f-primer"}];
    const lo = pr.forward.strand === "+" ? pr.forward : pr.reverse, hi = lo === pr.forward ? pr.reverse : pr.forward;
    zoomRegion(lo.start, hi.end); redrawMap();
  });
  redrawMap();
}

function showSeqDesign(r) {
  const ex = list => list.length ? `<table><thead><tr><th>Oligo</th><th>Name</th><th class="num">3′ end</th><th class="num">bp to region</th><th class="num">Tm</th><th class="num">mism.</th><th class="num" title="|distance − 150|/50 + 2×mismatches + 2 if >700 bp; lower is better">score</th></tr></thead><tbody>${
    list.map(h => `<tr><td>${esc(h.ids.join(", "))}</td><td>${esc(h.names.join(", "))}</td><td class="num">${h.three_prime}</td><td class="num">${h.distance}${h.late ? ` <span class="badge b-warn">late</span>` : ""}</td><td class="num">${h.tm ?? ""}</td><td class="num">${h.mismatches || ""}</td><td class="num">${h.score}</td></tr>`).join("")}</tbody></table>`
    : `<p class="note">No collection primer qualifies on this side.</p>`;
  const nw = (list, dir) => list.length ? `<table><thead><tr><th></th><th>new primer 5′→3′</th><th class="num">nt</th><th class="num">Tm °C</th><th class="num">GC %</th><th class="num">binds</th><th>checks</th><th></th></tr></thead><tbody>${list.map((p, j) => primerRow(p, dir, primerName(dir === "new F" ? "seqF" : "seqR", j + 1), "sequencing")).join("")}</tbody></table>` : "";
  $("#dresults").innerHTML = `${r.note ? `<p class="msgs">${esc(r.note)}</p>` : ""}
    <p class="note">${esc(r.filters)}. Specificity checked against: ${esc(r.checked_against)}.</p>
    <div class="card"><h3>Forward reads (collection first)</h3>${ex(r.existing_forward)}${nw(r.new.forward, "new F")}</div>
    <div class="card"><h3>Reverse reads</h3>${ex(r.existing_reverse)}${nw(r.new.reverse, "new R")}</div>`;
  redrawMap();
}

/* ── GenBank cleaner (preview + download; the original is never modified) ── */
let cleanRules = null, cleanChosen = null;
const RULE_HELP = {
  exact_duplicates: "identical duplicates", merge_same: "same feature annotated twice", generic_labels: "stacked 'Insert' / generic labels",
  unlabelled_dupe: "unlabelled copy of a labelled feature", unescape_labels: "backslash-escaped labels", map_keys: "non-standard feature keys → INSDC",
  drop_vntifkey: "Vector NTI key qualifier", synonyms: "label synonyms (AmpR, KanR, 35S terminator…)",
  map_unknown_keys: "any other non-standard type (CLC, Vector NTI, ApE, hand-made) → standard, so SnapGene/Benchling keep it",
  strip_quotes: "CLC's quoted second label", english_dates: "Danish date (14-okt-2008) → English",
  drop_colours: "ApE colours", fragments_to_comment: "'Fragment (…)' history → COMMENT", vector_to_comment: "whole-plasmid 'Vector' → COMMENT",
  clc_primer_hits: "CLC primer hits with mismatches (not lab primers)", name_unlabelled: "placeholder names for unlabelled features"};

async function paneClean() {
  if (current.format !== "genbank") { $("#pane").innerHTML = `<p class="note">The cleaner works on GenBank files; this one is ${esc(current.format)}.</p>`; return; }
  cleanRules = cleanRules || await api("/api/clean/rules");
  cleanChosen = cleanChosen || new Set(cleanRules.default_on);
  const box = r => `<label style="display:inline-flex;gap:4px;margin:2px 10px 2px 0"><input type="checkbox" data-r="${r}"${cleanChosen.has(r) ? " checked" : ""}>${esc(RULE_HELP[r] || r)}</label>`;
  $("#pane").innerHTML = `
    <p class="note">Dry run on this map. The original file is never changed: download a cleaned copy, or run the batch cleaner (<code>python -m plasmidbank.clean</code>). Sequence and topology are verified identical.</p>
    <div><b>Safe defaults</b><br>${cleanRules.default_on.map(box).join("")}</div>
    <div style="margin-top:6px"><b>Opt-in</b> <span class="note">(changes structure; information is moved to notes/COMMENT, not lost)</span><br>${cleanRules.opt_in.map(box).join("")}</div>
    <div class="controls" style="margin-top:10px"><button class="primary" id="cdl" title="GenBank keeps the sequence, features and topology. The cleaner's change list is not stored in the file.">Download cleaned .gb</button><span id="csum" class="note"></span></div>
    <div id="cres"></div>`;
  $("#pane").querySelectorAll("input[data-r]").forEach(c => c.onchange = () => { c.checked ? cleanChosen.add(c.dataset.r) : cleanChosen.delete(c.dataset.r); runClean(); });
  $("#cdl").onclick = () => { location.href = `/api/maps/${current.key}/clean.gb?rules=${[...cleanChosen].join(",")}`; };
  runClean();
}

async function runClean() {
  let r;
  try { r = await api(`/api/maps/${current.key}/clean?rules=${[...cleanChosen].join(",")}`); }
  catch (e) { $("#cres").innerHTML = `<p class="v-bad">${esc(e.message)}</p>`; return; }
  $("#csum").textContent = `${r.changes.length} change(s) · ${r.flags.length} flag(s) · ${r.n_before} → ${r.n_after} features`;
  const t = (rows, title) => rows.length ? `<h3 style="font-size:14px;margin:14px 0 6px">${title}</h3><table><thead><tr><th>Rule</th><th>Action</th><th>Feature</th><th>Detail</th></tr></thead><tbody>${
    rows.map(c => `<tr><td>${esc(c.rule)}</td><td>${esc(c.action)}</td><td class="ctx" style="white-space:normal">${esc(c.feature)}</td><td>${esc(c.detail)}</td></tr>`).join("")}</tbody></table>` : "";
  $("#cres").innerHTML = (t(r.changes, "Changes") + t(r.flags, "Flags — reported, not changed")) || `<p class="v-good">Nothing to clean.</p>`;
}

function panePrimers() {
  primerAll = false;
  $("#pane").innerHTML = `
    <div class="controls">
      <label>max 5′ mismatches <input type="number" id="mm" min="0" max="5" value="2"></label>
      <label>min binding nt <input type="number" id="minb" min="12" max="40" value="15"></label>
      <label>filter <input type="text" id="pf" placeholder="name or PM-id"></label>
      <label title="drag on the map or click a feature to select a region"><input type="checkbox" id="psel"${selRegion ? " checked" : ""}> only in the selection</label>
      <button class="primary" id="pgo">Find primers</button>
      <button id="pclear" title="remove the primer from the map (your selection stays)">Clear primer</button>
      <span class="note">3′-terminal 12 nt must match exactly; 5′ tails are allowed. Tm of the binding part: primer3 nearest-neighbour (SantaLucia 1998), 50 mM Na⁺, 2.0 mM Mg²⁺, 0.2 mM dNTP, 500 nM primer.</span>
    </div><div id="presults"></div>`;
  const run = async () => {
    const k = `${current.key}:${$("#mm").value}:${$("#minb").value}`;
    $("#presults").innerHTML = `<p class="note">Matching…</p>`;
    primerCache[k] = primerCache[k] || await api(`/api/maps/${current.key}/primers?max_mismatches=${$("#mm").value}&min_binding=${$("#minb").value}`);
    showPrimers(primerCache[k]);
  };
  $("#pgo").onclick = run;
  $("#pclear").onclick = () => {
    overlay = overlay.filter(o => !["tick", "primer"].includes(o.kind));
    $("#presults").querySelectorAll("tr.sel").forEach(tr => tr.classList.remove("sel"));
    redrawMap();
  };
  $("#pf").oninput = $("#psel").onchange = reshowPrimers;
  run();
}

let pcrPick = [], pcrPols = null;
async function pcrPanel() {
  const box = $("#pcrbox"); if (!box) return;
  pcrPols = pcrPols || await api("/api/pcr/polymerases").catch(() => null);
  if (!pcrPols) { box.innerHTML = ""; return; }
  box.innerHTML = `<div class="card" style="margin-top:10px"><b>PCR product</b> <span class="note">${pcrPick.length === 2 ? `with ${pcrPick.map(esc).join(" + ")}` : "tick two primers above, or paste two sequences"}</span>
    <div class="controls" style="margin:6px 0">
      ${pcrPick.length === 2 ? "" : `<input type="text" id="pcrf" placeholder="forward 5′→3′" style="width:220px;font-family:var(--mono)"><input type="text" id="pcrr" placeholder="reverse 5′→3′" style="width:220px;font-family:var(--mono)">`}
      <label>Polymerase <select id="pcrpol">${pcrPols.polymerases.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("")}</select></label>
      <label>Template <select id="pcrtpl">${pcrPols.templates.map(t => `<option>${esc(t)}</option>`).join("")}</select></label>
      <button class="primary" id="pcrgo">Simulate</button></div><div id="pcrout"></div></div>`;
  $("#pcrgo").onclick = async () => {
    const primers = pcrPick.length === 2 ? pcrPick.map(id => ({oligo_id: id})) : [{name: "forward", seq: $("#pcrf").value}, {name: "reverse", seq: $("#pcrr").value}];
    let r;
    try { r = await api(`/api/maps/${current.key}/pcr`, {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({primers, polymerase: $("#pcrpol").value, template: $("#pcrtpl").value})}); }
    catch (e) { $("#pcrout").innerHTML = `<p class="v-bad">${esc(e.message)}</p>`; return; }
    const pr = x => `${esc(x.name)}: binds ${x.start}–${x.end} (${x.binding} nt${x.tail ? `, ${x.tail} nt tail` : ""}${x.mismatches ? `, ${x.mismatches} mismatch(es)` : ""}), Tm ${x.tm} °C`;
    $("#pcrout").innerHTML = `<p><b>${r.product.toLocaleString()} bp</b> (map ${r.map_start.toLocaleString()}–${r.map_end.toLocaleString()}) · ${esc(r.polymerase)}, ${esc(r.template)} template</p>
      <div class="note">${pr(r.forward)}<br>${pr(r.reverse)}</div>
      ${r.warnings.map(w => `<div class="msgs">⚠ ${esc(w)}</div>`).join("")}
      <table style="margin-top:6px"><thead><tr><th>Step</th><th class="num">°C</th><th>Time</th><th>Cycles</th></tr></thead><tbody>${
        r.program.map(x => `<tr><td>${esc(x.step)}</td><td class="num">${x.c}</td><td>${esc(x.time)}</td><td>${esc(x.cycles || "")}</td></tr>`).join("")}</tbody></table>
      <p class="note">Annealing ${r.annealing} °C: ${esc(r.annealing_rule)}${r.two_step ? " — at or above 72 °C, so annealing and extension are one step" : ""}.
        Tm here is this app's model (${esc(r.tm_model)}); ${esc(r.polymerase.split(" ")[0])}'s own calculator can differ by a few °C, so check it for a critical PCR.</p>
      <p class="note">${r.notes.map(esc).join(" ")} Confidence: ${esc(r.confidence)}. Sources: ${r.sources.map(u => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\//, "").split("/")[0])}</a>`).join(", ")}</p>
      <div class="controls"><button id="pcrshow">Show on the map</button><button id="pcrcopy">Copy product</button>
        <button id="pcrsave">Save product to My workspace</button><span id="pcrmsg" class="note"></span></div>`;
    $("#pcrshow").onclick = () => { setSelection(r.map_start, r.map_end, `PCR ${r.product} bp`); zoomRegion(r.map_start, r.map_end); };
    $("#pcrcopy").onclick = () => navigator.clipboard.writeText(r.product_seq).catch(() => {});
    $("#pcrsave").onclick = async () => {
      try {  // an upload without a lab ID lands in My workspace (created on first use)
        const a = await askNameFolder("Save to My workspace", r.name, "PCR products");
        if (!a) return;
        const fd = new FormData();
        fd.append("file", new File([r.genbank], asciiName(a.label) + ".gb", {type: "text/plain"})); fd.append("plasmid_id", "");
        fd.append("construct_name", a.label); fd.append("folder", a.folder);
        const d = await api("/api/upload", {method: "POST", body: fd});
        $("#pcrmsg").innerHTML = `<span class="v-good">saved in My workspace${a.folder ? "/" + esc(a.folder) : ""}</span> · <a href="#${d.key}/features" data-open="${d.key}">open it</a>`;
        $("#pcrmsg [data-open]").onclick = e => { e.preventDefault(); loadProjectFolders(); openMap(+e.target.dataset.open); };
      } catch (e) { $("#pcrmsg").innerHTML = `<span class="v-bad">${esc(e.message)}</span>`; }
    };
  };
}

function reshowPrimers() { const k = Object.keys(primerCache).find(x => x.startsWith(current.key + ":")); if (k) showPrimers(primerCache[k]); }

/* 1-based inclusive spans that may wrap the origin (end < start), as plain pieces */
function spanPieces(s, e, L) { return e >= s ? [[s, e]] : [[s, L], [1, e]]; }
function overlapsSel(h) {
  const L = current.length, r = selRegion;
  return spanPieces(h.start, h.end, L).some(([a, b]) => spanPieces(r.start, r.end, L).some(([c, d]) => a <= d && c <= b));
}

let primerAll = false;  // the Primers list shows 20 binding sites until "show all"
function showPrimers(hits) {
  const f = ($("#pf").value || "").toLowerCase();
  const inSel = $("#psel").checked && selRegion;
  const rows = hits.filter(h => (!f || (h.oligo_ids.join(" ") + " " + h.names.join(" ")).toLowerCase().includes(f)) && (!inSel || overlapsSel(h)));
  $("#presults").innerHTML = `<p class="note">${rows.length} binding site(s)${f ? " matching filter" : ""}${inSel ? ` touching ${selRegion.start.toLocaleString()}–${selRegion.end.toLocaleString()}` : $("#psel").checked ? " (nothing selected yet: drag on the map)" : ""}. Click a row to show it on the map.</p>
    <table><thead><tr><th title="tick two for a PCR product">PCR</th><th>Oligo</th><th>Name</th><th>Strand</th><th class="num">Binds</th><th class="num">3′ end</th><th class="num">Bind nt</th><th class="num">Mism.</th><th class="num">Tail</th><th class="num">Tm °C</th><th></th></tr></thead><tbody>${
    rows.slice(0, primerAll ? rows.length : 20).map((h, i) => `<tr class="click" data-i="${i}"><td><input type="checkbox" data-pcr="${i}"${pcrPick.includes(h.oligo_ids[0]) ? " checked" : ""}></td><td>${esc(h.oligo_ids.join(", "))}</td><td>${esc(h.names.join(", "))}</td><td>${h.strand === "+" ? "→ fwd" : "← rev"}</td>
      <td class="num">${h.start}–${h.end}</td><td class="num">${h.three_prime}</td><td class="num">${h.binding_length}/${h.oligo_length}</td>
      <td class="num">${h.mismatches || ""}</td><td class="num">${h.tail_length || ""}</td><td class="num">${h.tm ?? ""}</td>
      <td>${current.format === "genbank" ? `<button data-padd="${i}" title="add it to the map as a primer_bind feature (Features → edit; save in place in My workspace, or as a copy)">＋ map</button>` : ""}</td></tr>`).join("")}</tbody></table>
    <div class="controls">${rows.length > 20 ? `<button id="pmore">${primerAll ? "List the first 20" : `List all ${rows.length}`}</button>` : ""}
      ${rows.length > 1 && rows.length <= 60 ? `<button id="pmapall" title="every primer in this list on the map and in the sequence view, so you can pick the one you need">Show all ${rows.length} on the map</button>`
        : rows.length > 60 ? `<span class="note">Select a region (or filter) to put the primers on the map all at once.</span>` : ""}</div>
    <div id="pcrbox"></div>`;
  $("#pmore") && ($("#pmore").onclick = () => { primerAll = !primerAll; showPrimers(hits); });
  $("#pmapall") && ($("#pmapall").onclick = () => {
    overlay = [...overlay.filter(o => o.kind === "region" || o.kind === "orf"),
      ...rows.map(h => ({kind: "primer", start: h.start, end: h.end, strand: h.strand, label: h.names[0] || h.oligo_ids[0]}))];
    redrawMap();
  });
  $("#presults").querySelectorAll("[data-pcr]").forEach(c => { c.onclick = e => e.stopPropagation(); c.onchange = () => {
    const id = rows[+c.dataset.pcr].oligo_ids[0];
    pcrPick = c.checked ? [...pcrPick.filter(x => x !== id), id].slice(-2) : pcrPick.filter(x => x !== id);
    $("#presults").querySelectorAll("[data-pcr]").forEach(x => x.checked = pcrPick.includes(rows[+x.dataset.pcr].oligo_ids[0]));
    pcrPanel();
  }; });
  pcrPanel();
  $("#presults").querySelectorAll("tr.click").forEach(tr => tr.onclick = () => {
    $("#presults").querySelectorAll("tr.sel").forEach(x => x.classList.remove("sel")); tr.classList.add("sel");
    // the user's selection stays on the map (it vanished when a primer was chosen)
    const h = rows[+tr.dataset.i]; overlay = [...overlay.filter(o => o.kind === "region" || o.kind === "orf"), {kind: "tick", pos: h.three_prime, color: "--f-primer"},
      {kind: "primer", start: h.start, end: h.end, strand: h.strand, label: h.names[0] || h.oligo_ids[0]}]; zoomRegion(h.start, h.end); redrawMap();
  });
  $("#presults").querySelectorAll("[data-padd]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const h = rows[+b.dataset.padd];
    editMode = true;
    edits = edits || {features: {}, add: [], seq: [], name: current.name, topology: current.topology || "circular"};
    edits.add.push({label: h.names[0] || h.oligo_ids[0], type: "primer_bind", start: h.start, end: h.end, strand: h.strand === "-" ? -1 : 1});
    tab = "features"; renderDetail();
  });
}

init().catch(e => { $("#stats").textContent = "Could not reach the server: " + e.message; });
</script>
</body>
